name: ACLED Weekly Refresh Reminder

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Tuesday 00:00 UTC. The job opens an issue only after HDX metadata shows
    # a new ACLED aggregate as-of date, avoiding calendar-only false reminders.
    - cron: '0 0 * * 2'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Open ACLED weekly refresh reminder issue
        uses: actions/github-script@v8
        with:
          script: |
            const packageIds = [
              'political-violence-events-and-fatalities',
              'civilian-targeting-events-and-fatalities',
              'demonstration-events',
            ];
            const formatIsoDate = (date) => date.toISOString().slice(0, 10);
            const parseDatasetDateEnd = (value) => {
              const match = typeof value === 'string' ? value.match(/\bTO\s+(\d{4}-\d{2}-\d{2})T/u) : null;
              return match?.[1] || null;
            };
            const parseAsOfDate = (value) => {
              const match = typeof value === 'string' ? value.match(/as-of-(\d{4}-\d{2}-\d{2})/iu) : null;
              return match?.[1] || null;
            };
            const fetchHdxPackage = async (id) => {
              const url = `https://data.humdata.org/api/3/action/package_show?id=${encodeURIComponent(id)}`;
              const response = await fetch(url, {
                headers: { 'user-agent': 'GFRRBot/1.0 acled-hdx-refresh-reminder' },
              });
              if (!response.ok) throw new Error(`HDX package_show ${id} failed: ${response.status}`);
              const payload = await response.json();
              if (payload?.success !== true || !payload.result) throw new Error(`HDX package_show ${id} returned no result`);
              return payload.result;
            };
            const probeHdx = async () => {
              const packages = await Promise.all(packageIds.map(fetchHdxPackage));
              const entries = packages.map((pkg) => {
                const resource = Array.isArray(pkg.resources) ? pkg.resources[0] : null;
                return {
                  id: pkg.name,
                  resourceName: resource?.name || null,
                  resourceFormat: resource?.format || null,
                  datasetEndDate: parseDatasetDateEnd(pkg.dataset_date),
                  asOfDate: parseAsOfDate(`${resource?.name || ''} ${resource?.url || ''}`),
                  metadataModified: pkg.metadata_modified || null,
                  resourceLastModified: resource?.last_modified || null,
                };
              });
              const asOfDates = [...new Set(entries.map((entry) => entry.asOfDate).filter(Boolean))].sort();
              const blockers = [];
              if (entries.length !== packageIds.length) blockers.push('missing_packages');
              if (entries.some((entry) => entry.resourceFormat !== 'XLSX')) blockers.push('non_xlsx_resource');
              if (entries.some((entry) => !entry.asOfDate)) blockers.push('missing_resource_as_of_date');
              if (entries.some((entry) => !entry.datasetEndDate)) blockers.push('missing_dataset_end_date');
              if (asOfDates.length !== 1) blockers.push(`inconsistent_as_of_dates:${asOfDates.join(',')}`);
              return {
                status: blockers.length ? 'hdx_acled_asof_not_ready' : 'hdx_acled_asof_ready',
                readyForManualReminder: blockers.length === 0,
                asOfDate: asOfDates.length === 1 ? asOfDates[0] : null,
                entries,
                blockers,
              };
            };

            let probe;
            try {
              probe = await probeHdx();
            } catch (err) {
              console.log(`HDX metadata probe unavailable; no issue opened: ${err instanceof Error ? err.message : String(err)}`);
              return;
            }
            console.log(`HDX metadata probe: ${probe.status} asOfDate=${probe.asOfDate || 'null'} blockers=${probe.blockers.join(',') || 'none'}`);
            if (!probe.readyForManualReminder) return;

            const today = new Date();
            const utcDate = new Date(Date.UTC(
              today.getUTCFullYear(),
              today.getUTCMonth(),
              today.getUTCDate()
            ));
            const isoDay = utcDate.getUTCDay() === 0 ? 7 : utcDate.getUTCDay();
            const monday = new Date(utcDate);
            monday.setUTCDate(utcDate.getUTCDate() - isoDay + 1);
            const mondayIso = formatIsoDate(monday);
            const title = `M-63c ACLED weekly regional xlsx refresh available (HDX as-of ${probe.asOfDate})`;
            const body = [
              `ACLED weekly regional aggregate files must be downloaded manually by the operator. This issue opened only after HDX CKAN metadata showed all three ACLED aggregate packages at as-of ${probe.asOfDate}.`,
              ``,
              `The HDX check is a release-availability proxy only: HDX data is month-country/year-country, not the weekly-admin signal used by GFRR. This workflow does not download HDX data files, does not fetch ACLED data files, and does not contact acleddata.com. ACLED EULA Section 3.3 still prohibits automated scraping/crawling.`,
              ``,
              `Calendar week at workflow run: ${mondayIso}.`,
              ``,
              `## Download`,
              ``,
              `- Download URL: https://acleddata.com/conflict-data/download-data-files`,
              `- Target directory: \`manual-artifacts/world-order/acled-input/weekly/\` (gitignored)`,
              ``,
              `## Required regional files`,
              ``,
              `- Africa`,
              `- Middle-East`,
              `- Europe-and-Central-Asia`,
              `- United-States-and-Canada`,
              `- Latin-America-and-the-Caribbean`,
              `- Asia-Pacific`,
              ``,
              `## Commands`,
              ``,
              `\`\`\`powershell`,
              `npm run acled:status`,
              `npm run acled:publish`,
              `npm run check:all`,
              `\`\`\``,
              ``,
              `\`acled:status\` runs sanitize:weekly + check:world-order-acled-weekly and reports config-vs-data status (read-only; expect \`data_current\`).`,
              ``,
              `If status is \`sanitized_not_refreshed\`, run \`npm run acled:publish\` — the explicit opt-in full-chain helper: commit config + push + dispatch "Refresh World Order Stress" + watch CI + pull + re-verify (requires authenticated \`gh\` CLI; ends with \`data_current\`). Without \`gh\`, do the same steps manually: commit/push \`config/world-order-acled-regional-weekly.json\`, then Actions -> "Refresh World Order Stress" -> Run workflow.`,
              ``,
              `Expected final validation: \`npm run check:all\` PASS.`,
              ``,
              `## Commit pattern`,
              ``,
              `\`\`\`text`,
              `data: refresh ACLED weekly regional aggregate`,
              `\`\`\``,
              ``,
              `Commit only \`config/world-order-acled-regional-weekly.json\`; raw xlsx files must remain untracked under \`manual-artifacts/\`.`,
              ``,
              `## Runbook`,
              ``,
              `Follow [\`docs/M-63_ACLED_INTEGRATION.md\` Section 3 + Section 9](../blob/main/docs/M-63_ACLED_INTEGRATION.md).`,
              ``,
              `## Freshness threshold`,
              ``,
              `- Latest week 30-90 days old: warn`,
              `- Latest week >90 days old: fail`,
              ``,
              `## Idempotency`,
              ``,
              `This workflow skips if any issue, open or closed, already exists with this exact HDX as-of title and the \`acled-weekly-refresh\` label. Different HDX as-of dates open new reminders; unchanged HDX metadata stays silent.`,
              ``,
              `_Auto-opened by \`.github/workflows/acled-weekly-refresh-reminder.yml\`. Closing without action will silently age the ACLED weekly data — re-open or recreate manually if needed._`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'acled-weekly-refresh',
              per_page: 100,
            });
            const duplicate = existing.find((issue) => issue.title === title);
            if (duplicate) {
              console.log(`Issue already exists for this HDX as-of date: ${duplicate.html_url}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['acled-weekly-refresh', 'manual-data-refresh'],
            });
            console.log(`Opened issue: ${issue.html_url}`);
