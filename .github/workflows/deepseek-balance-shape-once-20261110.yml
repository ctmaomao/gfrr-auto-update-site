name: DeepSeek Balance Shape Once 20261110

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      acknowledge_single_read:
        description: 'Authorize the single balance-structure GET; no amounts, article, retry or publication'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: deepseek-balance-shape-once-20261110
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.repository == 'ctmaomao/gfrr-auto-update-site' &&
          github.run_number == 1 && github.run_attempt == 1 && inputs.acknowledge_single_read == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: external-ai-production-refresh
    env:
      BALANCE_DIAGNOSTIC: ${{ inputs.acknowledge_single_read }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify one-time context and expiry before credential step
        run: |
          node --input-type=module -e "import { diagnosticContextAllowed } from './scripts/lib/deepseek-balance-diagnostics.mjs'; if (!diagnosticContextAllowed(process.env)) process.exit(1);"
      - name: Read balance structure once and retain HOLD
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/diagnose-deepseek-balance.mjs --allow-balance-read
