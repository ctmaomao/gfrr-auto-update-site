name: Check Realtime Health

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

concurrency:
  group: realtime-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check realtime health
        run: node scripts/check-realtime-health.mjs --fail-on-stale
