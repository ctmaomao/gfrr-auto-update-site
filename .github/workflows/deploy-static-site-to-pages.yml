name: Deploy Static Site to Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Daily Radar Data
      - Refresh World Order Stress
      - External AI Production Refresh
      - Refresh QQQ Market Pricing
      - Refresh Oil Directional Pressure
      - Refresh Oil Thermal Watch
      - Refresh Oil News Event Watch
      - Refresh Bubble Watch
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'bubble-watch.html'
      - 'assets/**'
      - 'scripts/**'
      - 'data/**'
      - 'realtime/**'
      - '.github/workflows/deploy-static-site-to-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  # GitHub Pages accepts one effective deployment stream for the environment.
  # Queue deploys instead of canceling in-flight runs; canceling after a
  # deployment has been created can surface as "Deployment failed, try again later".
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url || steps.deployment_retry_3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Run full check suite
        run: npm run check:all

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait before Pages deploy retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Retry deploy to GitHub Pages 1
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait before Pages deploy retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 180

      - name: Retry deploy to GitHub Pages 2
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait before Pages deploy retry 3
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        run: sleep 300

      - name: Retry deploy to GitHub Pages 3
        id: deployment_retry_3
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report Pages deploy retry state
        if: always()
        run: |
          echo "primary deploy outcome: ${{ steps.deployment.outcome }}"
          echo "retry 1 deploy outcome: ${{ steps.deployment_retry_1.outcome }}"
          echo "retry 2 deploy outcome: ${{ steps.deployment_retry_2.outcome }}"
          echo "retry 3 deploy outcome: ${{ steps.deployment_retry_3.outcome }}"
