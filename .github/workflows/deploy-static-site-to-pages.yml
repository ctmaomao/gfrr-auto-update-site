name: Deploy Static Site to Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Daily Radar Data
      - Refresh World Order Stress
      - External AI Production Refresh
      - Refresh QQQ Market Pricing
      - Refresh Oil Directional Pressure
      - Refresh Oil Thermal Watch
      - Refresh Oil News Event Watch
      - Refresh Bubble Watch
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'bubble-watch.html'
      - 'assets/**'
      - 'scripts/**'
      - 'data/**'
      - 'realtime/**'
      - '.github/workflows/deploy-static-site-to-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  # GitHub Pages accepts one effective deployment stream for the environment.
  # Queue deploys instead of canceling in-flight runs; canceling after a
  # deployment has been created can surface as "Deployment failed, try again later".
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Run full check suite
        run: npm run check:all

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait before Pages deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report Pages deploy retry state
        if: always()
        run: |
          echo "primary deploy outcome: ${{ steps.deployment.outcome }}"
          echo "retry deploy outcome: ${{ steps.deployment_retry.outcome }}"
