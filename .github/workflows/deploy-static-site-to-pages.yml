name: Deploy Static Site to Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Daily Radar Data
      - Refresh World Order Stress
      - External AI Production Refresh
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - 'data/**'
      - 'realtime/**'
      - '.github/workflows/deploy-static-site-to-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Check DOM mount IDs
        run: npm run check:dom

      - name: Check module imports
        run: npm run check:modules

      - name: Check user-facing copy contract
        run: npm run check:copy

      - name: Check Node runtime baseline
        run: npm run check:node-runtime

      - name: Check workflow contract
        run: npm run check:workflows

      - name: Check documentation links
        run: npm run check:docs

      - name: Check homepage IA contract
        run: npm run check:homepage-ia-contract

      - name: Check editorial redesign contract
        run: npm run check:editorial-redesign-contract

      - name: Validate data contract
        run: npm run check:data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
