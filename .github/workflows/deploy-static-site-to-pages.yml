name: Deploy Static Site to Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - 'data/**'
      - 'realtime/**'
      - '.github/workflows/deploy-static-site-to-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Check DOM mount IDs
        run: npm run check:dom

      - name: Check module imports
        run: npm run check:modules

      - name: Check user-facing copy contract
        run: npm run check:copy

      - name: Check workflow contract
        run: npm run check:workflows

      - name: Validate data contract
        run: npm run check:data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
