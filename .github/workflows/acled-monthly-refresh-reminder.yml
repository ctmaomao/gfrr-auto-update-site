name: ACLED Monthly Refresh Reminder

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 9th of each month at 00:00 UTC. The job opens an issue only after HDX
    # metadata shows a new ACLED aggregate as-of date.
    - cron: '0 0 9 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Open ACLED monthly refresh reminder issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const packageIds = [
              'political-violence-events-and-fatalities',
              'civilian-targeting-events-and-fatalities',
              'demonstration-events',
            ];
            const parseDatasetDateEnd = (value) => {
              const match = typeof value === 'string' ? value.match(/\bTO\s+(\d{4}-\d{2}-\d{2})T/u) : null;
              return match?.[1] || null;
            };
            const parseAsOfDate = (value) => {
              const match = typeof value === 'string' ? value.match(/as-of-(\d{4}-\d{2}-\d{2})/iu) : null;
              return match?.[1] || null;
            };
            const fetchHdxPackage = async (id) => {
              const url = `https://data.humdata.org/api/3/action/package_show?id=${encodeURIComponent(id)}`;
              const response = await fetch(url, {
                headers: { 'user-agent': 'GFRRBot/1.0 acled-hdx-refresh-reminder' },
              });
              if (!response.ok) throw new Error(`HDX package_show ${id} failed: ${response.status}`);
              const payload = await response.json();
              if (payload?.success !== true || !payload.result) throw new Error(`HDX package_show ${id} returned no result`);
              return payload.result;
            };
            const probeHdx = async () => {
              const packages = await Promise.all(packageIds.map(fetchHdxPackage));
              const entries = packages.map((pkg) => {
                const resource = Array.isArray(pkg.resources) ? pkg.resources[0] : null;
                return {
                  id: pkg.name,
                  resourceName: resource?.name || null,
                  resourceFormat: resource?.format || null,
                  datasetEndDate: parseDatasetDateEnd(pkg.dataset_date),
                  asOfDate: parseAsOfDate(`${resource?.name || ''} ${resource?.url || ''}`),
                  metadataModified: pkg.metadata_modified || null,
                  resourceLastModified: resource?.last_modified || null,
                };
              });
              const asOfDates = [...new Set(entries.map((entry) => entry.asOfDate).filter(Boolean))].sort();
              const blockers = [];
              if (entries.length !== packageIds.length) blockers.push('missing_packages');
              if (entries.some((entry) => entry.resourceFormat !== 'XLSX')) blockers.push('non_xlsx_resource');
              if (entries.some((entry) => !entry.asOfDate)) blockers.push('missing_resource_as_of_date');
              if (entries.some((entry) => !entry.datasetEndDate)) blockers.push('missing_dataset_end_date');
              if (asOfDates.length !== 1) blockers.push(`inconsistent_as_of_dates:${asOfDates.join(',')}`);
              return {
                status: blockers.length ? 'hdx_acled_asof_not_ready' : 'hdx_acled_asof_ready',
                readyForManualReminder: blockers.length === 0,
                asOfDate: asOfDates.length === 1 ? asOfDates[0] : null,
                entries,
                blockers,
              };
            };

            let probe;
            try {
              probe = await probeHdx();
            } catch (err) {
              console.log(`HDX metadata probe unavailable; no issue opened: ${err instanceof Error ? err.message : String(err)}`);
              return;
            }
            console.log(`HDX metadata probe: ${probe.status} asOfDate=${probe.asOfDate || 'null'} blockers=${probe.blockers.join(',') || 'none'}`);
            if (!probe.readyForManualReminder) return;

            const now = new Date();
            const monthIso = `${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}`;
            const title = `M-63c ACLED monthly global xlsx refresh available (HDX as-of ${probe.asOfDate})`;
            const body = [
              `ACLED monthly global aggregate files must be downloaded manually by the operator. This issue opened only after HDX CKAN metadata showed all three ACLED aggregate packages at as-of ${probe.asOfDate}.`,
              ``,
              `The HDX check is a release-availability proxy only. This workflow does not download HDX data files, does not fetch ACLED data files, and does not contact acleddata.com. ACLED EULA Section 3.3 still prohibits automated scraping/crawling.`,
              ``,
              `Calendar month at workflow run: ${monthIso}.`,
              ``,
              `## Download`,
              ``,
              `- Download URL: https://acleddata.com/conflict-data/download-data-files`,
              `- Target directory: \`manual-artifacts/world-order/acled-input/monthly/\` (gitignored)`,
              ``,
              `## Required monthly files`,
              ``,
              `- \`number_of_demonstration_events_by_country-year_as-of-<DD><Mmm><YYYY>.xlsx\``,
              `- \`number_of_events_targeting_civilians_by_country-year_as-of-<DD><Mmm><YYYY>.xlsx\``,
              `- \`number_of_political_violence_events_by_country-month-year_as-of-<DD><Mmm><YYYY>.xlsx\``,
              `- \`number_of_political_violence_events_by_country-year_as-of-<DD><Mmm><YYYY>.xlsx\``,
              `- \`number_of_reported_civilian_fatalities_by_country-year_as-of-<DD><Mmm><YYYY>.xlsx\``,
              `- \`number_of_reported_fatalities_by_country-year_as-of-<DD><Mmm><YYYY>.xlsx\``,
              ``,
              `All 6 files must share the same \`as-of-<DD><Mmm><YYYY>\` date stamp. The sanitizer fails if any expected file is missing.`,
              ``,
              `## Commands`,
              ``,
              `\`\`\`powershell`,
              `npm run acled:status:monthly`,
              `npm run check:all`,
              `\`\`\``,
              ``,
              `\`acled:status:monthly\` runs sanitize:monthly + check:world-order-acled-monthly and reports config-vs-data status (expect \`data_current\`; if \`sanitized_not_refreshed\` -> commit config + push + run "Refresh World Order Stress" workflow). The monthly sanitizer is strict — all 6 files must be present or it fails.`,
              ``,
              `Expected final validation: \`npm run check:all\` PASS.`,
              ``,
              `## Commit pattern`,
              ``,
              `\`\`\`text`,
              `data: refresh ACLED monthly global aggregate`,
              `\`\`\``,
              ``,
              `Commit only \`config/world-order-acled-global-monthly.json\`; raw xlsx files must remain untracked under \`manual-artifacts/\`.`,
              ``,
              `## Runbook`,
              ``,
              `Follow [\`docs/M-63_ACLED_INTEGRATION.md\` Section 9B](../blob/main/docs/M-63_ACLED_INTEGRATION.md).`,
              ``,
              `## Freshness threshold`,
              ``,
              `- <=35 days: fresh`,
              `- <=60 days: aging`,
              `- <=120 days: stale`,
              `- <=180 days: approaching fail`,
              `- >180 days: fail`,
              ``,
              `## Idempotency`,
              ``,
              `This workflow skips if any issue, open or closed, already exists with this exact HDX as-of title and the \`acled-monthly-refresh\` label. Different HDX as-of dates open new reminders; unchanged HDX metadata stays silent.`,
              ``,
              `_Auto-opened by \`.github/workflows/acled-monthly-refresh-reminder.yml\`. Closing without action will silently age the ACLED monthly data — re-open or recreate manually if needed._`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'acled-monthly-refresh',
              per_page: 100,
            });
            const duplicate = existing.find((issue) => issue.title === title);
            if (duplicate) {
              console.log(`Issue already exists for this HDX as-of date: ${duplicate.html_url}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['acled-monthly-refresh', 'manual-data-refresh'],
            });
            console.log(`Opened issue: ${issue.html_url}`);
