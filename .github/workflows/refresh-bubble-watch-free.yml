name: Refresh Bubble Watch Free

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

concurrency:
  group: gfrr-main-writer-main
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Refresh all Bubble evidence using free sources only
        env:
          BUBBLE_WATCH_EDGAR_CONTACT: ${{ secrets.BUBBLE_WATCH_EDGAR_CONTACT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TAVILY_BUDGET_GITHUB_TOKEN: ${{ github.token }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          BUBBLE_WATCH_DISABLE_WIND: '1'
        run: npm run build:bubble-watch

      - name: Report full-refresh scope and source limitations
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('data/bubble-watch.json', 'utf8'));
          if (data.meta.wind_key_present !== false || data.meta.paid_wind_fallback_count !== 0 || data.meta.qualified_refresh) throw new Error('Expected a full refresh with Wind disabled and zero paid fallbacks');
          console.log('### Full free-only Bubble refresh');
          console.log('Wind disabled. No DeepSeek generation. Free-search admission remains fail-closed.');
          console.log('Package date is not proof that every observation is fresh; source dates and fallback modes below remain authoritative.');
          console.log(`Package date: ${data.as_of_date}; auto: ${data.meta.auto_count}; curated: ${data.meta.curated_count}; fallback: ${data.meta.fallback_count}; source failures: ${data.meta.fetch_failures.length}.`);
          for (const item of data.indicators) console.log(`- ${item.id}: observation ${item.as_of}; stale=${item.stale}; mode=${item.provenance.mode}`);
          NODE

      - run: npm run check:bubble-watch

      - run: npm run check:gdelt-cache-health

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bubble-watch.json data/bubble-watch-history.json data/gdelt-bubble-watch-cache.json config/bubble-watch-curated.json
          if ! git diff --cached --quiet; then
            npm run check:all
            git commit -m "chore: refresh bubble watch"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - name: Request the existing guarded custom-domain publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-edgeone-release.yml --repo "$GITHUB_REPOSITORY" --ref main
