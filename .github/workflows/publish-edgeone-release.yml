name: Publish EdgeOne Release Channel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_REPOSITORY: ctmaomao/gfrr-edgeone-release

on:
  workflow_dispatch:
  workflow_run:
    # News and thermal producers can commit after an earlier publisher pins main.
    # Their successful completion queues a fresh checkout (ADR-0085 / ADR-0114).
    workflows: [Macro Risk Editorial Refresh, Bubble Watch Weekly Editorial Refresh, Bubble Watch Editorial Follow-up, Refresh Oil Directional Pressure, Refresh Oil News Event Watch, Refresh Oil Thermal Watch]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '55 */3 * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'bubble-watch.html'
      - 'weekly-reports.html'
      - 'reports/**'
      - 'weekly-reports/**'
      - 'assets/**'
      - 'scripts/app.js'
      - 'scripts/modules/**'
      - 'scripts/build-pages-artifact.mjs'
      - 'scripts/build-edgeone-release-artifact.mjs'
      - 'scripts/lib/edgeone-csp-policy.mjs'
      - 'config/edgeone/**'
      - '.github/workflows/publish-edgeone-release.yml'

permissions:
  contents: read

concurrency:
  group: edgeone-release-publisher
  cancel-in-progress: false

jobs:
  publication_check:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_publish: ${{ steps.review.outcome != 'success' || steps.review.outputs.should_publish != 'false' }}
    steps:
      - name: Checkout publication admission code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup publication review Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Review upstream publication admission
        id: review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/review-pages-deployment.mjs --upstream-only

  publish:
    needs: publication_check
    if: ${{ !cancelled() && (needs.publication_check.result != 'success' || needs.publication_check.outputs.should_publish != 'false') && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record checked source revision
        id: source_revision
        run: |
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Trigger source: ${GITHUB_SHA}; checked latest-main source: ${source_sha}." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run full check suite
        run: npm run check:all

      - name: Build allowlisted static artifact
        run: npm run build:pages-artifact

      # The EdgeOne channel gets its own staging tree: the shared Pages artifact plus the generated
      # `edgeone.json`. Keeping the config out of `_site` leaves the Pages artifact untouched, and
      # generating it here means the published config cannot be silently deleted by the whole-tree
      # sync below. `tee` only copies what the generator actually printed; `pipefail` (already set
      # by `set -euo pipefail`) keeps a generation or validation failure from being masked by it.
      - name: Build EdgeOne release staging tree
        run: |
          set -euo pipefail
          set -o pipefail
          staging="$RUNNER_TEMP/edgeone-staging"
          config="$GITHUB_WORKSPACE/config/edgeone/csp-report-only.json"
          {
            echo '### EdgeOne staging tree'
            echo '```text'
            node scripts/build-edgeone-release-artifact.mjs \
              --add-config --artifact-dir "$GITHUB_WORKSPACE/_site" --config "$config" --out-dir "$staging"
            node scripts/build-edgeone-release-artifact.mjs \
              --check --artifact-dir "$GITHUB_WORKSPACE/_site" --config "$config" --out-dir "$staging"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure release deploy key
        env:
          EDGEONE_RELEASE_DEPLOY_KEY: ${{ secrets.EDGEONE_RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$EDGEONE_RELEASE_DEPLOY_KEY" ]; then
            echo "EDGEONE_RELEASE_DEPLOY_KEY is not configured." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EDGEONE_RELEASE_DEPLOY_KEY" > "$HOME/.ssh/gfrr_edgeone_release"
          chmod 600 "$HOME/.ssh/gfrr_edgeone_release"
          curl -fsSL --retry 3 https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' \
            > "$HOME/.ssh/known_hosts"

      - name: Publish changed artifact with quota guard
        env:
          SOURCE_SHA: ${{ steps.source_revision.outputs.sha }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/gfrr_edgeone_release -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          release_dir="$RUNNER_TEMP/edgeone-release"
          mkdir -p "$release_dir"
          git -C "$release_dir" init -b main
          git -C "$release_dir" remote add origin "git@github.com:${RELEASE_REPOSITORY}.git"

          if git -C "$release_dir" ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git -C "$release_dir" fetch origin main
            git -C "$release_dir" checkout -B main FETCH_HEAD
          fi

          # Same command as before; only the source moves from the shared Pages artifact to the
          # EdgeOne staging tree, which additionally carries the generated edgeone.json. The `.git/`
          # exclusion stays: without it the sync would delete the release checkout's own metadata.
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/edgeone-staging/" "$release_dir/"
          cd "$release_dir"
          git add -A

          if git diff --cached --quiet; then
            echo "No published-file changes; EdgeOne build not triggered." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_count=0
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            release_count=$(git rev-list --count --since='32 days ago' HEAD)
          fi
          echo "Release commits in the last 32 days: ${release_count}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$release_count" -ge 400 ]; then
            echo "Quota guard stopped publication at 400 releases in 32 days." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish source ${SOURCE_SHA::12}"
          git push origin main
          # Record the release commit that the platform will build from. A successful push here does
          # NOT mean EdgeOne has deployed: the response header can only be bound to this SHA once the
          # corresponding EdgeOne build is confirmed and read back.
          release_sha=$(git rev-parse HEAD)
          echo "Published checked source ${SOURCE_SHA} to ${RELEASE_REPOSITORY}." >> "$GITHUB_STEP_SUMMARY"
          echo "Release commit: ${release_sha}" >> "$GITHUB_STEP_SUMMARY"
          echo "EdgeOne build has not been confirmed by this workflow; bind this SHA after the build succeeds." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release deploy key
        if: always()
        run: rm -f "$HOME/.ssh/gfrr_edgeone_release"
