name: Build Daily Radar Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'

concurrency:
  group: gfrr-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Use latest realtime payload
        run: |
          set -euo pipefail
          mkdir -p realtime
          git fetch origin realtime-data
          git show origin/realtime-data:realtime/market.json > realtime/market.json
          REALTIME_SHA="$(git rev-parse origin/realtime-data)"
          echo "GFRR_REALTIME_COMMIT_SHA=$REALTIME_SHA" >> "$GITHUB_ENV"

      - name: Generate radar data
        run: npm run build:data

      - name: Validate output
        run: npm run validate

      - name: Summarize daily output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/radar-data.json', 'utf8'));
          const input = data.dailyRealtimeInput || {};
          const baseline = data.displayInputsBaseline || {};
          const decisionModel = data.decisionModel || {};
          const tradingSystem = data.tradingSystem || {};
          const executionLock = tradingSystem.executionLock || {};
          const signalEngine = tradingSystem.signalEngine || {};
          const actionLayer = tradingSystem.actionLayer || {};
          const riskControl = tradingSystem.riskControl || {};
          const get = (obj, path, fallback = '--') => (
            path.split('.').reduce((acc, key) => (
              acc && Object.hasOwn(acc, key) ? acc[key] : undefined
            ), obj) ?? fallback
          );
          const short = (value) => {
            if (value === null || value === undefined) return '--';
            if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
            try {
              const json = JSON.stringify(value);
              return json.length > 120 ? `${json.slice(0, 117)}...` : json;
            } catch {
              return '--';
            }
          };
          const tableValue = (value) => short(value).replace(/\r?\n/g, ' ').replace(/\|/g, '\\|');
          const pickStateValue = (value) => {
            if (value === null || value === undefined) return '--';
            if (typeof value !== 'object' || Array.isArray(value)) return value;
            for (const key of ['label', 'state', 'name', 'value', 'mode', 'status', 'level', 'color']) {
              if (value[key] !== undefined && value[key] !== null) return value[key];
            }
            return value;
          };
          const countArray = (value) => Array.isArray(value) ? value.length : '--';
          const summarizePositionGuidance = (guidance) => {
            if (!guidance || typeof guidance !== 'object' || Array.isArray(guidance)) return '--';
            const keys = ['targetExposure', 'min', 'max', 'band', 'range', 'label', 'totalExposureBand', 'targetGrossExposure', 'cashBufferTarget', 'riskBudget'];
            const parts = keys
              .filter((key) => guidance[key] !== undefined && guidance[key] !== null)
              .map((key) => `${key}: ${short(guidance[key])}`);
            return parts.length ? parts.join('; ') : guidance;
          };
          const rows = [
            ['dailyRealtimeInput.commitSha', input.commitSha || '--'],
            ['dailyRealtimeInput.updatedAt', input.updatedAt || '--'],
            ['dailyRealtimeInput.sourceMode', input.sourceMode || '--'],
            ['dailyRealtimeInput.healthScore', input.healthScore ?? '--'],
            ['baseline Brent', baseline.brent ?? '--'],
            ['baseline broad dollar', baseline.dxy ?? '--'],
            ['baseline VIX', baseline.vix ?? '--'],
            ['baseline HY OAS', baseline.hyOas ?? '--'],
            ['baseline SPX', baseline.spx ?? '--']
          ];
          const decisionRows = [
            ['strategyState', pickStateValue(decisionModel.strategyState)],
            ['riskMode', pickStateValue(decisionModel.riskMode)],
            ['decision headline', get(decisionModel, 'decisionStatement.headline')],
            ['decision posture', get(decisionModel, 'decisionStatement.posture')],
            ['decision actionBias', get(decisionModel, 'decisionStatement.actionBias')],
            ['decision condition', get(decisionModel, 'decisionStatement.condition')],
            ['position guidance', summarizePositionGuidance(decisionModel.positionGuidance)],
            ['execution lock', executionLock.state ?? executionLock.status ?? executionLock.level ?? executionLock.color ?? '--'],
            ['signal engine state', signalEngine.state ?? signalEngine.status ?? '--'],
            ['action checkpoints', countArray(actionLayer.checkpoints)],
            ['control actions', countArray(actionLayer.actions ?? actionLayer.controlActions)],
            ['hard thresholds', countArray(riskControl.hardThresholds)],
            ['reset thresholds', countArray(riskControl.resetThresholds)]
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Daily Radar Summary',
            '',
            '| Item | Value |',
            '|---|---|',
            ...rows.map(([key, value]) => `| ${key} | ${tableValue(value)} |`),
            '',
            '## Decision Summary',
            '',
            '| Item | Value |',
            '|---|---|',
            ...decisionRows.map(([key, value]) => `| ${key} | ${tableValue(value)} |`),
            ''
          ].join('\n'));
          NODE

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-data.json data/radar-history.json data/radar-history-full.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh radar data"
            git push
          fi
