name: Build Daily Radar Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'

concurrency:
  group: gfrr-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Use latest realtime payload
        run: |
          set -euo pipefail
          mkdir -p realtime
          git fetch origin realtime-data
          git show origin/realtime-data:realtime/market.json > realtime/market.json
          REALTIME_SHA="$(git rev-parse origin/realtime-data)"
          echo "GFRR_REALTIME_COMMIT_SHA=$REALTIME_SHA" >> "$GITHUB_ENV"

      - name: Generate radar data
        run: npm run build:data

      - name: Validate output
        run: npm run validate

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-data.json data/radar-history.json data/radar-history-full.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh radar data"
            git push
          fi
