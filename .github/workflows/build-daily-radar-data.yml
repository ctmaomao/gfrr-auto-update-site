name: Build Daily Radar Data

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'

concurrency:
  group: gfrr-main-writer-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Use latest realtime payload
        run: |
          set -euo pipefail
          mkdir -p realtime
          git fetch origin realtime-data
          git show origin/realtime-data:realtime/market.json > realtime/market.json
          REALTIME_SHA="$(git rev-parse origin/realtime-data)"
          echo "GFRR_REALTIME_COMMIT_SHA=$REALTIME_SHA" >> "$GITHUB_ENV"

      - name: Audit Daily realtime input vs Worker preview
        run: node scripts/audit-daily-vs-worker.mjs --github-summary

      - name: Generate radar data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
          GFRR_MAIN_SCORE_WIND_FALLBACK: "1"
        run: npm run build:data

      - name: Validate output
        run: npm run check:data

      - name: Summarize daily output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const data = JSON.parse(fs.readFileSync('data/radar-data.json', 'utf8'));
          const input = data.dailyRealtimeInput || {};
          const baseline = data.displayInputsBaseline || {};
          const mainScoreSourcePolicy = data.mainScoreSourcePolicy || {};
          const decisionModel = data.decisionModel || {};
          const tradingSystem = data.tradingSystem || {};
          const executionLock = tradingSystem.executionLock || {};
          const signalEngine = tradingSystem.signalEngine || {};
          const actionLayer = tradingSystem.actionLayer || {};
          const riskControl = tradingSystem.riskControl || {};
          const get = (obj, path) => (
            path.split('.').reduce((acc, key) => (
              acc && Object.hasOwn(acc, key) ? acc[key] : undefined
            ), obj)
          );
          const short = (value, max = 140) => {
            if (value === null || value === undefined || value === '') return '--';
            if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
            try {
              const json = JSON.stringify(value);
              return json.length > max ? `${json.slice(0, max - 3)}...` : json;
            } catch {
              return '--';
            }
          };
          const tableValue = (value) => short(value).replace(/\r?\n/g, ' ').replace(/\|/g, '\\|');
          const pathIsInside = (basePath, targetPath) => {
            const relativePath = path.relative(path.resolve(basePath), path.resolve(targetPath));
            return relativePath === '' || (!relativePath.startsWith('..') && !path.isAbsolute(relativePath));
          };
          const validateGithubSummaryPath = (summaryPath, env = process.env) => {
            if (env.GITHUB_ACTIONS !== 'true') return { ok: false, reason: 'github_actions_env_required' };
            if (!summaryPath) return { ok: false, reason: 'github_step_summary_missing' };
            if (!env.RUNNER_TEMP) return { ok: false, reason: 'runner_temp_missing' };
            if (!pathIsInside(env.RUNNER_TEMP, summaryPath)) return { ok: false, reason: 'summary_path_outside_runner_temp' };
            if (env.GITHUB_WORKSPACE && pathIsInside(env.GITHUB_WORKSPACE, summaryPath)) {
              return { ok: false, reason: 'summary_path_inside_workspace' };
            }
            return { ok: true };
          };
          const pick = (...values) => {
            for (const value of values) {
              if (value !== null && value !== undefined && value !== '') return value;
            }
            return '--';
          };
          const labelOf = (value) => {
            if (value === null || value === undefined || value === '') return '--';
            if (typeof value !== 'object' || Array.isArray(value)) return value;
            return pick(value.label, value.state, value.status, value.name, value.value, value.mode, value.level, value.color, short(value));
          };
          const pickPath = (...paths) => pick(...paths.map((path) => get(data, path)));
          const countOf = (value) => {
            if (Array.isArray(value)) return value.length;
            if (value && typeof value === 'object') {
              for (const key of ['items', 'actions', 'controlActions', 'checkpoints', 'queue', 'priorityActions', 'blockedActions', 'watchItems', 'checklist', 'blocked']) {
                if (Array.isArray(value[key])) return value[key].length;
              }
              return Object.keys(value).length;
            }
            return '--';
          };
          const summarizePositionGuidance = (guidance) => {
            if (!guidance || typeof guidance !== 'object' || Array.isArray(guidance)) return '--';
            const keys = ['targetExposure', 'min', 'max', 'band', 'range', 'label', 'totalExposureBand', 'targetGrossExposure', 'cashBufferTarget', 'riskBudget'];
            const parts = keys
              .filter((key) => guidance[key] !== undefined && guidance[key] !== null)
              .map((key) => `${key}: ${short(guidance[key])}`);
            return parts.length ? parts.join('; ') : guidance;
          };
          const rows = [
            ['dailyRealtimeInput.commitSha', input.commitSha || '--'],
            ['dailyRealtimeInput.updatedAt', input.updatedAt || '--'],
            ['dailyRealtimeInput.sourceMode', input.sourceMode || '--'],
            ['dailyRealtimeInput.healthScore', input.healthScore ?? '--'],
            ['baseline Brent', baseline.brent ?? '--'],
            ['baseline broad dollar', baseline.dxy ?? '--'],
            ['baseline VIX', baseline.vix ?? '--'],
            ['baseline HY OAS', baseline.hyOas ?? '--'],
            ['baseline SPX', baseline.spx ?? '--'],
            ['mainScoreSourcePolicy.status', mainScoreSourcePolicy.status || '--'],
            ['mainScoreSourcePolicy.appliedInputs', Array.isArray(mainScoreSourcePolicy.appliedInputs) ? mainScoreSourcePolicy.appliedInputs.join(', ') || '--' : '--'],
            ['mainScoreSourcePolicy.reviewRequiredInputs', Array.isArray(mainScoreSourcePolicy.reviewRequiredInputs) ? mainScoreSourcePolicy.reviewRequiredInputs.join(', ') || '--' : '--']
          ];
          const decisionStatement = pick(
            decisionModel.decisionStatement,
            data.decisionStatement,
            tradingSystem.decisionStatement
          );
          const positionGuidance = pick(
            decisionModel.positionGuidance,
            data.positionGuidance,
            tradingSystem.positionGuidance
          );
          const executionLockValue = pick(
            tradingSystem.executionLock,
            decisionModel.executionLock,
            data.executionLock
          );
          const signalEngineValue = pick(
            tradingSystem.signalEngine,
            data.signalEngine
          );
          const decisionRows = [
            ['strategyState', labelOf(pickPath('decisionModel.strategyState', 'strategyState'))],
            ['riskMode', labelOf(pickPath('decisionModel.riskMode', 'riskMode', 'tradingSystem.riskMode', 'decisionModel.stateLabel', 'warningSystem.status'))],
            ['decision headline', pick(get(decisionStatement, 'headline'), get(decisionStatement, 'title'), data.decisionLine, data.summary, decisionModel.stateLabel)],
            ['decision posture', pick(get(decisionStatement, 'posture'), get(decisionStatement, 'summary'), decisionModel.stateLabel, executionLock.levelLabel, decisionModel.strategyState)],
            ['decision actionBias', pick(get(decisionStatement, 'actionBias'), get(decisionStatement, 'bias'), executionLock.title, actionLayer.todayAction, decisionModel.positionGuidance?.newExposurePolicy)],
            ['decision condition', pick(get(decisionStatement, 'condition'), get(decisionStatement, 'reason'), decisionModel.stateReason, executionLock.description, actionLayer.priorityLine)],
            ['position guidance', summarizePositionGuidance(positionGuidance)],
            ['execution lock', labelOf(pick(executionLockValue, get(decisionModel, 'executionLock'), data.executionLock))],
            ['signal engine state', labelOf(pick(signalEngine.state, signalEngine.status, signalEngine.mode, data.signalEngine?.state, data.signalEngine?.status, signalEngine.direction, signalEngine.consistency))],
            ['action checkpoints', countOf(pickPath('tradingSystem.actionLayer.checkpoints', 'actionLayer.checkpoints', 'decisionModel.actionLayer.checkpoints'))],
            ['control actions', countOf(pickPath('tradingSystem.actionLayer.controlActions', 'tradingSystem.actionLayer.actions', 'decisionModel.actionQueue.controlActions', 'decisionModel.actionQueue.actions', 'decisionModel.actionQueue.priorityActions', 'decisionModel.actionQueue', 'actionQueue'))],
            ['hard thresholds', countOf(pickPath('tradingSystem.riskControl.hardThresholds', 'riskControl.hardThresholds'))],
            ['reset thresholds', countOf(pickPath('tradingSystem.riskControl.resetThresholds', 'riskControl.resetThresholds'))]
          ];
          const fmtDelta = (value) => {
            const n = Number(value);
            if (!Number.isFinite(n)) return '--';
            if (n > 0) return `Δ +${n}`;
            if (n < 0) return `Δ ${n}`;
            return 'Δ 0';
          };
          const transmissionMeta = data.transmissionDeltaMeta || {};
          const transmissionNodes = Array.isArray(data.transmissionChain?.nodes)
            ? data.transmissionChain.nodes
            : [];
          const deltaNodes = transmissionNodes.map((node) => ({
            label: node?.label || node?.key || node?.id || '--',
            score: Number(node?.score),
            delta: Number.isFinite(node?.delta) ? node.delta : null
          }));
          const positiveDeltas = deltaNodes.filter((node) => Number.isFinite(node.delta) && node.delta > 0);
          const negativeDeltas = deltaNodes.filter((node) => Number.isFinite(node.delta) && node.delta < 0);
          const zeroDeltas = deltaNodes.filter((node) => Number.isFinite(node.delta) && node.delta === 0);
          const pendingDeltas = deltaNodes.filter((node) => !Number.isFinite(node.delta));
          const describeDeltaNode = (node) => node ? `${node.label} ${fmtDelta(node.delta)}` : '--';
          const largestPositive = positiveDeltas.length
            ? positiveDeltas.reduce((best, node) => node.delta > best.delta ? node : best, positiveDeltas[0])
            : null;
          const largestNegative = negativeDeltas.length
            ? negativeDeltas.reduce((best, node) => node.delta < best.delta ? node : best, negativeDeltas[0])
            : null;
          const transmissionRows = [
            ['delta source', transmissionMeta.source || '--'],
            ['matched nodes', transmissionMeta.matchedNodes ?? '--'],
            ['total nodes', transmissionMeta.totalNodes ?? (transmissionNodes.length || '--')],
            ['positive deltas', positiveDeltas.length],
            ['negative deltas', negativeDeltas.length],
            ['zero deltas', zeroDeltas.length],
            ['pending deltas', pendingDeltas.length],
            ['largest positive', describeDeltaNode(largestPositive)],
            ['largest negative', describeDeltaNode(largestNegative)]
          ];
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const summaryValidation = validateGithubSummaryPath(summaryPath);
          if (!summaryValidation.ok) {
            throw new Error(`Refusing GitHub Summary path: ${summaryValidation.reason}`);
          }
          fs.appendFileSync(summaryPath, [
            '## Daily Radar Summary',
            '',
            '| Item | Value |',
            '|---|---|',
            ...rows.map(([key, value]) => `| ${key} | ${tableValue(value)} |`),
            '',
            '## Decision Summary',
            '',
            '| Item | Value |',
            '|---|---|',
            ...decisionRows.map(([key, value]) => `| ${key} | ${tableValue(value)} |`),
            '',
            '## Transmission Delta Summary',
            '',
            '| Item | Value |',
            '|---|---|',
            ...transmissionRows.map(([key, value]) => `| ${key} | ${tableValue(value)} |`),
            ''
          ].join('\n'));
          NODE

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-data.json data/radar-history.json data/radar-history-full.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            npm run check:all
            git commit -m "chore: refresh radar data"
            git push
          fi
