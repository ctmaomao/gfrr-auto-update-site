name: External AI Production Refresh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
    inputs:
      input_source:
        description: "Input source"
        type: choice
        required: true
        default: local_compact
        options:
          - local_compact
      allow_network:
        description: "Allow DeepSeek network call"
        type: boolean
        required: true
        default: true
      acknowledge_cost:
        description: "Acknowledge provider cost"
        type: boolean
        required: true
        default: true
      validate_output:
        description: "Validate provider output"
        type: boolean
        required: true
        default: true
      timeout_ms:
        description: "Provider timeout in ms"
        type: number
        required: true
        default: 120000

permissions:
  contents: write
  actions: read

concurrency:
  group: external-ai-production-refresh
  cancel-in-progress: false

jobs:
  external_ai_production_refresh:
    name: external-ai-production-refresh
    runs-on: ubuntu-latest
    environment: external-ai-production-refresh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Preflight refresh workflow contract
        run: npm run check:external-ai-production-refresh-workflow

      - name: Resolve refresh inputs
        id: refresh_inputs
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            input_source="${{ inputs.input_source }}"
            allow_network="${{ inputs.allow_network }}"
            acknowledge_cost="${{ inputs.acknowledge_cost }}"
            validate_output="${{ inputs.validate_output }}"
            timeout_ms="${{ inputs.timeout_ms }}"
          else
            input_source="local_compact"
            allow_network="true"
            acknowledge_cost="true"
            validate_output="true"
            timeout_ms="120000"
          fi

          acknowledge_non_production="true"
          max_attempts="1"

          if [ "$input_source" != "local_compact" ]; then
            echo "input_source must be local_compact"
            exit 1
          fi
          if [ "$allow_network" != "true" ]; then
            echo "allow_network must be true for approved production refresh"
            exit 1
          fi
          if [ "$acknowledge_cost" != "true" ]; then
            echo "acknowledge_cost must be true for approved production refresh"
            exit 1
          fi
          if [ "$acknowledge_non_production" != "true" ]; then
            echo "acknowledge_non_production must be true"
            exit 1
          fi
          if [ "$validate_output" != "true" ]; then
            echo "validate_output must be true"
            exit 1
          fi
          if [ "$max_attempts" != "1" ]; then
            echo "max_attempts must be 1"
            exit 1
          fi
          if ! printf '%s' "$timeout_ms" | grep -Eq '^[0-9]+$'; then
            echo "timeout_ms must be numeric"
            exit 1
          fi
          if [ "$timeout_ms" -gt 180000 ]; then
            echo "timeout_ms must be <= 180000"
            exit 1
          fi

          {
            echo "input_source=$input_source"
            echo "allow_network=$allow_network"
            echo "acknowledge_cost=$acknowledge_cost"
            echo "acknowledge_non_production=$acknowledge_non_production"
            echo "validate_output=$validate_output"
            echo "timeout_ms=$timeout_ms"
            echo "max_attempts=$max_attempts"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare refresh artifact directory
        run: mkdir -p manual-artifacts/external-ai

      - name: Build local compact input
        run: node scripts/build-external-ai-manual-input.mjs --compact --output manual-artifacts/external-ai/manual-input-compact-latest.json

      - name: Run DeepSeek production refresh provider call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "missing_required_environment_secret"
            exit 1
          fi

          node scripts/run-external-ai-manual-test.mjs \
            --provider deepseek \
            --input manual-artifacts/external-ai/manual-input-compact-latest.json \
            --output manual-artifacts/external-ai/deepseek-output-latest.json \
            --allow-network \
            --validate-output \
            --timeout-ms "${{ steps.refresh_inputs.outputs.timeout_ms }}"

      - name: Validate provider output
        run: npm run check:external-ai-output -- manual-artifacts/external-ai/deepseek-output-latest.json

      - name: Run external AI quality review
        run: npm run review:external-ai-artifact -- --input manual-artifacts/external-ai/deepseek-output-latest.json --output manual-artifacts/external-ai/external-ai-quality-review-latest.json

      - name: Project production contract object
        run: |
          node scripts/project-external-ai-production-dry-run.mjs \
            --input manual-artifacts/external-ai/deepseek-output-latest.json \
            --review manual-artifacts/external-ai/external-ai-quality-review-latest.json \
            --output manual-artifacts/external-ai/external-ai-production-projection-latest.json \
            --preserve-display-state-from data/radar-data.json

      - name: Validate projection
        run: npm run check:external-ai-production-contract -- manual-artifacts/external-ai/external-ai-production-projection-latest.json

      - name: Sanitize refresh artifacts
        id: sanitize_refresh_artifacts
        run: npm run check:external-ai-workflow-artifacts -- --workflow-provider-test

      - name: Upload sanitized refresh artifacts
        if: ${{ always() && steps.sanitize_refresh_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: external-ai-production-refresh-${{ github.run_id }}
          path: |
            manual-artifacts/external-ai/manual-input-compact-latest.json
            manual-artifacts/external-ai/deepseek-output-latest.json
            manual-artifacts/external-ai/external-ai-quality-review-latest.json
            manual-artifacts/external-ai/external-ai-production-projection-latest.json
          if-no-files-found: error
          retention-days: 3

      - name: Write production data layer
        run: |
          npm run write:external-ai-production -- \
            --input manual-artifacts/external-ai/external-ai-production-projection-latest.json \
            --target data/radar-data.json \
            --confirm-production-write \
            --data-only \
            --no-frontend-display \
            --preserve-visible-display

      - name: Validate final production data
        run: |
          npm run check:external-ai-production-contract -- data/radar-data.json
          npm run check:external-ai-production-write-guard
          npm run check:external-ai-frontend-hidden-scaffold
          npm run check:data
          npm run check:all

      - name: Protected path assertion
        run: |
          set -euo pipefail

          changed_paths="$(git diff --name-only)"
          if [ -z "$changed_paths" ]; then
            echo "No tracked file changes after refresh."
            exit 0
          fi

          if [ "$changed_paths" != "data/radar-data.json" ]; then
            echo "Unexpected tracked file changes:"
            printf '%s\n' "$changed_paths"
            exit 1
          fi

          if git status --short -- manual-artifacts | grep -q .; then
            echo "manual-artifacts must not be committed"
            exit 1
          fi

      - name: Commit refreshed production layer if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- data/radar-data.json; then
            echo "No external AI production data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-data.json

          staged_paths="$(git diff --cached --name-only)"
          if [ "$staged_paths" != "data/radar-data.json" ]; then
            echo "Unexpected staged file changes:"
            printf '%s\n' "$staged_paths"
            exit 1
          fi

          git commit -m "chore: refresh external AI interpretation layer"
          git push origin HEAD:main
