name: Inspect Bubble Capex Events

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bubble-capex-event-inspection-main
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify isolated event collection contract
        run: node --test tests/unit/bubble-capex-event-collector.test.mjs tests/unit/bubble-capex-quarterly-panel.test.mjs
      - name: Collect bounded free diagnostic panel
        run: node scripts/collect-bubble-capex-events.mjs --quarterly --allow-network --write
      - name: Retain derived evidence and source failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bubble-capex-event-panel-${{ github.run_id }}
          path: manual-artifacts/bubble-capex-event-panel-latest.json
          retention-days: 14
          if-no-files-found: warn
