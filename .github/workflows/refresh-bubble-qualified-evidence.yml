name: Refresh Bubble Qualified Evidence

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

concurrency:
  group: gfrr-main-writer-main
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main before refresh
        run: git pull --ff-only origin main
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Freshly collect only the four free qualified indicators
        env:
          BUBBLE_WATCH_DISABLE_WIND: '1'
        run: node scripts/build-bubble-watch.mjs --refresh-qualified-only --publish-qualified
      - name: Validate full production contracts before commit
        run: npm run check:all
      - name: Verify complete October evidence and preserved observations
        run: node scripts/verify-bubble-qualified-refresh.mjs
      - name: Commit the two verified Bubble outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bubble-watch.json data/bubble-watch-history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh free Bubble qualified evidence"
            git push origin HEAD:main
          else
            echo "Qualified evidence unchanged; no commit."
          fi
      - name: Request the existing guarded custom-domain publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-edgeone-release.yml --repo "$GITHUB_REPOSITORY" --ref main
