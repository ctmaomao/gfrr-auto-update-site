name: Transport Shock Free-Proxy Score-Readiness Gate Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '39 23 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: transport-shock-free-proxy-score-readiness-gate-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Monitor transport shock free-proxy score-readiness gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build real-event sample-set review input
        run: npm run review:transport-shock-confirmation-factor-free-proxy-historical-replay-real-event-samples -- --allow-empty

      - name: Run free-proxy score-readiness gate monitor
        run: npm run monitor:transport-shock-confirmation-factor-free-proxy-score-readiness-gate

      - name: Upload monitor artifact
        uses: actions/upload-artifact@v7
        with:
          name: transport-shock-free-proxy-score-readiness-gate-monitor
          path: manual-artifacts/transport-shock-confirmation-factor/free-proxy-score-readiness-gate-monitor-latest.json
          if-no-files-found: error
          retention-days: 14
