name: Refresh Oil Thermal Watch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours; FIRMS NRT is fast but satellite-pass limited.
    - cron: '17 */3 * * *'

concurrency:
  group: gfrr-main-writer-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Refresh oil thermal watch
        id: thermal_refresh
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          export THERMAL_ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "actual_checkout_sha=$THERMAL_ACTUAL_CHECKOUT_SHA" >> "$GITHUB_OUTPUT" || true
          npm run build:oil-thermal-watch -- --research-receipt

      - name: Validate and publish
        run: |
          git add data/oil-thermal-watch.json
          if git diff --cached --quiet; then
            npm run check:oil-thermal-watch
            exit
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then exit "$diff_status"; fi
          fi
          npm run check:all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh oil thermal watch"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Verify current-run research receipt
        id: research_receipt
        if: ${{ always() && steps.thermal_refresh.outputs.research_receipt_written == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          THERMAL_CAPTURE_CHECKOUT_SHA: ${{ steps.thermal_refresh.outputs.actual_checkout_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { isCurrentThermalReceipt } from './scripts/oil-directional/thermal-receipt-run.mjs';
          try {
            const text = readFileSync('manual-artifacts/oil-thermal-research/receipt.json', 'utf8');
            const sha = process.env.THERMAL_CAPTURE_CHECKOUT_SHA;
            if (isCurrentThermalReceipt(text, {runId:process.env.GITHUB_RUN_ID,
                runAttempt:process.env.GITHUB_RUN_ATTEMPT, checkoutSha:sha})) {
              appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
            }
          } catch { /* Missing/invalid research artifact is not a production failure. */ }
          NODE

      - name: Upload bounded thermal research receipt
        if: ${{ always() && steps.research_receipt.outputs.ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oil-thermal-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: manual-artifacts/oil-thermal-research/receipt.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
