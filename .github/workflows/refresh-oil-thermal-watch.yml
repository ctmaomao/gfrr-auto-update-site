name: Refresh Oil Thermal Watch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours; FIRMS NRT is fast but satellite-pass limited.
    - cron: '17 */3 * * *'

concurrency:
  group: gfrr-main-writer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Refresh oil thermal watch
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: npm run build:oil-thermal-watch

      - run: npm run check:oil-thermal-watch

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oil-thermal-watch.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh oil thermal watch"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
