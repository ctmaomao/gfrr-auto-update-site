name: Build Realtime Market

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate realtime market
        run: npm run build:realtime

      - name: Commit updated realtime file to publish branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp realtime/market.json "$RUNNER_TEMP/market.json"
          git restore --worktree --staged realtime/market.json

          if git ls-remote --exit-code --heads origin realtime-data; then
            git fetch origin realtime-data
            git switch --create realtime-data --track origin/realtime-data || git switch realtime-data
          else
            git switch --create realtime-data
          fi

          mkdir -p realtime
          cp "$RUNNER_TEMP/market.json" realtime/market.json

          git add realtime/market.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh realtime market"
            git push --set-upstream origin realtime-data
          fi
