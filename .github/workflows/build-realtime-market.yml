name: Build Realtime Market

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: gfrr-realtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate realtime market
        run: npm run build:realtime

      - name: Summarize realtime output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const rt = JSON.parse(fs.readFileSync('realtime/market.json', 'utf8'));
          const c = rt.brentValidation?.consensus || {};
          const rows = [
            ['updatedAt', rt.updatedAt || '--'],
            ['sourceMode', rt.sourceMode || '--'],
            ['healthScore', rt.healthScore ?? '--'],
            ['Brent', rt.values?.brent ?? '--'],
            ['Brent consensus', c.recommendedValue ?? '--'],
            ['confidence', c.confidence ?? '--'],
            ['canPromoteToPrimary', c.canPromoteToPrimary ?? '--']
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Realtime Market Summary',
            '',
            '| Item | Value |',
            '|---|---|',
            ...rows.map(([key, value]) => `| ${key} | ${value} |`),
            ''
          ].join('\n'));
          NODE

      - name: Commit updated realtime file to publish branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly generated file before switching away from main.
          cp realtime/market.json "$RUNNER_TEMP/market.json"
          # Clean the tracked worktree file so branch switching cannot be blocked.
          git restore --worktree --staged realtime/market.json

          if git ls-remote --exit-code --heads origin realtime-data; then
            git fetch origin realtime-data
            git switch --create realtime-data --track origin/realtime-data || git switch realtime-data
          else
            git switch --create realtime-data
          fi

          mkdir -p realtime
          # Restore the generated realtime payload onto the publish branch.
          cp "$RUNNER_TEMP/market.json" realtime/market.json

          git add realtime/market.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh realtime market"
            git push --set-upstream origin realtime-data
          fi
