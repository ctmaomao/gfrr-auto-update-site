name: Verify EIA DNav hosted transport (one-time)
'on':
  push:
    branches: [codex/eia-dnav-hosted-probe-20261127]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.created && github.ref == 'refs/heads/codex/eia-dnav-hosted-probe-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check latest official eight-series cohort
        run: node tools/oil-directional/replay-eia-dnav-weekly.mjs --probe-cohort 2026-11-20 2026-11-25T15:30:00.000Z
