name: Refresh QQQ Market Pricing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 6'  # Saturday 08:00 UTC, after Friday US market close

concurrency:
  group: gfrr-main-writer-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      # Replaces the manual Nasdaq CSV download (scripts/refresh-qqq-data.ps1):
      # fetch Yahoo QQQ weekly history into data/market-pricing-history.json.
      - name: Refresh QQQ weekly history from Yahoo
        run: npm run market-pricing:qqq-yahoo:commit

      # QQQ is the primary asset; recompute the display-only temperature metrics.
      - name: Recompute market pricing metrics
        run: npm run market-pricing:metrics-calculation:commit

      - run: npm run check:all

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-pricing-history.json data/market-pricing-metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh QQQ weekly market data (yahoo auto)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
