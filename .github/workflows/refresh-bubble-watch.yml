name: Refresh Bubble Watch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # Monday 05:30 UTC — 周一更新(美股周五收盘 + 周末研究数据落定后)
    - cron: '30 5 * * 1'

concurrency:
  group: gfrr-main-writer-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Refresh bubble watch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
        run: npm run build:bubble-watch

      - run: npm run check:bubble-watch

      - run: npm run check:gdelt-cache-health

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bubble-watch.json data/bubble-watch-history.json data/gdelt-bubble-watch-cache.json config/bubble-watch-curated.json
          if ! git diff --cached --quiet; then
            npm run check:all
            git commit -m "chore: refresh bubble watch"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
