name: DeepSeek Key Identity

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepseek-key-fingerprint:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        scope: [external-ai-production-refresh, external-ai-manual]
    environment: ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Inspect DeepSeek key fingerprints without network or ledger access
        env:
          DEEPSEEK_KEY_SCOPE: ${{ matrix.scope }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/review-deepseek-key.mjs
