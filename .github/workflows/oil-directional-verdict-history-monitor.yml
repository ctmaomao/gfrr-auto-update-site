name: Oil Directional Verdict History Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '29 1 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: oil-directional-verdict-history-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Monitor ODP verdict history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run ODP verdict history monitor
        run: npm run monitor:oil-directional-verdict-history -- --github-summary

      - name: Upload monitor artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oil-directional-verdict-history-monitor
          path: manual-artifacts/oil-directional/oil-directional-verdict-history-monitor-latest.json
          if-no-files-found: error
          retention-days: 30
