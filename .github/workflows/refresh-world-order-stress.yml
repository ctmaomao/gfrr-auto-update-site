name: Refresh World Order Stress

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'  # 30 min after Build Daily Radar Data (22:30 UTC)

concurrency:
  group: gfrr-world-order-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Refresh world order stress
        env:
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
          # ACLED secrets reserved for M-60 (Research/Partner tier required)
        run: npm run build:world-order
        continue-on-error: true

      - run: npm run check:world-order

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-order-stress.json data/gdelt-world-order-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh world order stress"
            git push
          fi
