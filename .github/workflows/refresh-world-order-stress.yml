name: Refresh World Order Stress

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      acled_config_commit:
        description: 'Optional published ACLED commit for source-free refresh/recovery'
        type: string
        default: ''
      acled_weekly_sha256:
        description: 'Exact published weekly config SHA256'
        type: string
        default: ''
      acled_monthly_sha256:
        description: 'Exact published monthly config SHA256'
        type: string
        default: ''
  schedule:
    - cron: '0 23 * * *'  # 30 min after Build Daily Radar Data (22:30 UTC)

concurrency:
  group: gfrr-main-writer-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      ACLED_CONFIG_COMMIT: ${{ inputs.acled_config_commit }}
      ACLED_WEEKLY_SHA256: ${{ inputs.acled_weekly_sha256 }}
      ACLED_MONTHLY_SHA256: ${{ inputs.acled_monthly_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Verify published ACLED pair before refresh
        if: ${{ inputs.acled_config_commit != '' || inputs.acled_weekly_sha256 != '' || inputs.acled_monthly_sha256 != '' }}
        run: node scripts/verify-acled-refresh.mjs --before

      - name: Refresh world order stress
        env:
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
          # ACLED secrets reserved for M-60 (Research/Partner tier required)
        run: npm run build:world-order

      - run: npm run check:world-order

      - name: Verify derived ACLED projection
        if: ${{ inputs.acled_config_commit != '' || inputs.acled_weekly_sha256 != '' || inputs.acled_monthly_sha256 != '' }}
        run: node scripts/verify-acled-refresh.mjs --after

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-order-stress.json data/gdelt-world-order-cache.json
          if ! git diff --cached --quiet; then
            npm run check:all
            git commit -m "chore: refresh world order stress"
            git push
          fi

      - name: Dispatch custom-domain synchronization after verified ACLED refresh
        if: ${{ inputs.acled_config_commit != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-acled-refresh.mjs --edgeone
