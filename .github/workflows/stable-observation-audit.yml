name: Stable Observation Audit

on:
  workflow_dispatch:
  schedule:
    # Runs daily in UTC after the expected Daily Radar Data refresh window. Adjust later if Daily schedule changes.
    - cron: '30 10 * * *'

permissions:
  contents: read

concurrency:
  group: stable-observation-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check stable observation audit syntax
        run: node --check scripts/audit-stable-observation.mjs

      - name: Run stable observation audit
        run: npm run audit:stable-observation

      - name: Check external AI output fixture
        run: npm run check:external-ai-output

      - name: Check documentation links
        run: npm run check:docs

      - name: Validate data contract
        run: npm run check:data

      - name: Run full local checks
        run: npm run check:all
