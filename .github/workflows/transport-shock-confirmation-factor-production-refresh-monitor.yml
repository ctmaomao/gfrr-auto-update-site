name: Transport Shock Production Refresh Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '19 23 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: transport-shock-production-refresh-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Monitor transport shock production refresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run production refresh monitor
        run: npm run monitor:transport-shock-confirmation-factor-production-refresh -- --github-summary

      - name: Upload monitor artifact
        uses: actions/upload-artifact@v7
        with:
          name: transport-shock-production-refresh-monitor
          path: manual-artifacts/transport-shock-confirmation-factor/production-refresh-monitor-latest.json
          if-no-files-found: error
          retention-days: 14
