name: Check Worker Health

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '16,46 * * * *'

concurrency:
  group: worker-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check Worker health
        run: node scripts/check-worker-health.mjs --github-summary --fail-on-unhealthy --snapshot-file health-worker-snapshot.json

      - name: Upload Worker health snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worker-health-snapshot
          path: health-worker-snapshot.json
          if-no-files-found: error
          retention-days: 14
