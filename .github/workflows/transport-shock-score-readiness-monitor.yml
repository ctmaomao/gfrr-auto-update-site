name: Transport Shock Score-Readiness Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '29 23 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: transport-shock-score-readiness-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Monitor transport shock score-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run score-readiness monitor
        run: npm run monitor:transport-shock-confirmation-factor-score-readiness -- --github-summary

      - name: Upload monitor artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transport-shock-score-readiness-monitor
          path: manual-artifacts/transport-shock-confirmation-factor/score-readiness-monitor-latest.json
          if-no-files-found: error
          retention-days: 14
