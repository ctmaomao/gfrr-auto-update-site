name: Brave Private Canary
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preview or the single authorized test
        type: choice
        default: preview
        options:
          - preview
          - single-test
permissions:
  contents: read
concurrency:
  group: brave-private-canary
  cancel-in-progress: false
jobs:
  preview:
    # Retired; preserved only as historical wiring for the one-shot receipts.
    if: ${{ false && github.ref == 'refs/heads/main' && (inputs.operation == 'preview' || inputs.operation == 'single-test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Private read-only preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRAVE_BUDGET_PRIVATE_PROOF: ${{ secrets.BRAVE_BUDGET_PRIVATE_PROOF }}
          BRAVE_BUDGET_RENEWAL_CHAIN: ${{ secrets.BRAVE_BUDGET_RENEWAL_CHAIN }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: node scripts/run-brave-private-canary.mjs
  single-test:
    needs: preview
    # Retired; preserved only as historical wiring for the one-shot receipts.
    if: ${{ false && github.ref == 'refs/heads/main' && inputs.operation == 'single-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: One durable authorized request only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRAVE_BUDGET_PRIVATE_PROOF: ${{ secrets.BRAVE_BUDGET_PRIVATE_PROOF }}
          BRAVE_BUDGET_RENEWAL_CHAIN: ${{ secrets.BRAVE_BUDGET_RENEWAL_CHAIN }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: node scripts/run-brave-private-canary.mjs
