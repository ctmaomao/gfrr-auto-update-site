name: Test API Secrets (Diagnostic)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

concurrency:
  group: gfrr-test-api-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify secrets are configured (not exposed)
        id: verify_secrets
        run: |
          set +x  # never trace
          if [ -z "$ACLED_USERNAME" ]; then echo "FAIL: ACLED_USERNAME not configured"; exit 1; fi
          if [ -z "$ACLED_PASSWORD" ]; then echo "FAIL: ACLED_PASSWORD not configured"; exit 1; fi
          if [ -z "$GDELT_CLOUD_API_KEY" ]; then echo "FAIL: GDELT_CLOUD_API_KEY not configured"; exit 1; fi
          echo "PASS: All 3 secrets are configured (values redacted)"
          echo "ACLED_USERNAME length: ${#ACLED_USERNAME}"
          echo "ACLED_PASSWORD length: ${#ACLED_PASSWORD}"
          echo "GDELT_CLOUD_API_KEY length: ${#GDELT_CLOUD_API_KEY}"
        env:
          ACLED_USERNAME: ${{ secrets.ACLED_USERNAME }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}

      - name: Test ACLED OAuth token endpoint
        id: acled_oauth
        continue-on-error: true
        run: |
          set +x
          response=$(curl -s -w "\n%{http_code}" -X POST "https://acleddata.com/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "username=${ACLED_USERNAME}" \
            --data-urlencode "password=${ACLED_PASSWORD}" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "client_id=acled" \
            --data-urlencode "scope=authenticated")
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          echo "ACLED OAuth HTTP code: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "FAIL: ACLED OAuth returned $http_code"
            echo "Response preview (first 200 chars):"
            echo "$body" | cut -c1-200
            exit 1
          fi
          access_token=$(node -e "
            try {
              const r = JSON.parse(process.argv[1]);
              if (!r.access_token) { console.error('No access_token field'); process.exit(1); }
              console.log(r.access_token);
            } catch (e) {
              console.error('Parse error:', e.message);
              process.exit(1);
            }
          " "$body")
          if [ -z "$access_token" ]; then
            echo "FAIL: ACLED OAuth response did not contain access_token"
            exit 1
          fi
          token_len=${#access_token}
          echo "PASS: ACLED OAuth returned access_token (length: $token_len)"
          echo "::add-mask::$access_token"
          echo "ACLED_TOKEN=$access_token" >> "$GITHUB_ENV"
        env:
          ACLED_USERNAME: ${{ secrets.ACLED_USERNAME }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}

      - name: Test ACLED API call with bearer token
        id: acled_api
        continue-on-error: true
        run: |
          set +x
          response=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${ACLED_TOKEN}" \
            "https://acleddata.com/api/acled/read?_format=json&limit=5")
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          echo "ACLED API HTTP code: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "FAIL: ACLED API returned $http_code"
            echo "Response preview:"
            echo "$body" | cut -c1-300
            exit 1
          fi
          record_count=$(node -e "
            try {
              const r = JSON.parse(process.argv[1]);
              const data = Array.isArray(r.data) ? r.data.length : (Array.isArray(r) ? r.length : 0);
              console.log(data);
            } catch (e) {
              console.error('Parse error:', e.message);
              process.exit(1);
            }
          " "$body")
          echo "PASS: ACLED API returned $record_count records"
          if [ "$record_count" -gt 0 ]; then
            echo "Response keys preview:"
            node -e "
              const r = JSON.parse(process.argv[1]);
              if (Array.isArray(r.data) && r.data.length > 0) {
                console.log('First record fields:', Object.keys(r.data[0]).slice(0, 15).join(', '));
              }
            " "$body"
          fi

      - name: Test GDELT Cloud v2 API
        id: gdelt_events
        continue-on-error: true
        run: |
          set +x
          # Use a 7-day window ending today for recent events
          today=$(date -u +%Y-%m-%d)
          week_ago=$(date -u -d "7 days ago" +%Y-%m-%d)
          echo "Date window: $week_ago to $today"
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${GDELT_CLOUD_API_KEY}" \
            -H "Accept: application/json" \
            "https://gdeltcloud.com/api/v2/events?date_start=${week_ago}&date_end=${today}&sort=recent&limit=5")
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          echo "GDELT Cloud HTTP code: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "FAIL: GDELT Cloud returned $http_code"
            echo "Response preview:"
            echo "$body" | cut -c1-500
            exit 1
          fi
          parsed=$(node -e "
            try {
              const r = JSON.parse(process.argv[1]);
              const success = r.success === true ? 'true' : 'false';
              const dataLen = Array.isArray(r.data) ? r.data.length : 0;
              const hasPagination = r.pagination ? 'true' : 'false';
              console.log(JSON.stringify({ success, dataLen, hasPagination }));
            } catch (e) {
              console.error('Parse error:', e.message);
              process.exit(1);
            }
          " "$body")
          echo "Parsed response: $parsed"
          dataLen=$(echo "$parsed" | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf8')).dataLen)")
          successFlag=$(echo "$parsed" | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf8')).success)")
          if [ "$successFlag" != "true" ]; then
            echo "FAIL: GDELT Cloud response.success is not true"
            echo "$body" | cut -c1-300
            exit 1
          fi
          echo "PASS: GDELT Cloud returned $dataLen events"
          if [ "$dataLen" -gt 0 ]; then
            echo "First event fields:"
            node -e "
              const r = JSON.parse(process.argv[1]);
              if (Array.isArray(r.data) && r.data.length > 0) {
                console.log('Fields:', Object.keys(r.data[0]).slice(0, 15).join(', '));
                console.log('Sample id:', r.data[0].id);
                console.log('Sample family:', r.data[0].family);
                console.log('Sample event_date:', r.data[0].event_date);
                console.log('Sample geo.country:', r.data[0].geo?.country);
              }
            " "$body"
          fi
        env:
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}

      - name: Test GDELT Cloud events summary
        id: gdelt_summary
        continue-on-error: true
        run: |
          set +x
          today=$(date -u +%Y-%m-%d)
          week_ago=$(date -u -d "7 days ago" +%Y-%m-%d)
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${GDELT_CLOUD_API_KEY}" \
            "https://gdeltcloud.com/api/v2/events/summary?group_by=country&event_family=conflict&date_start=${week_ago}&date_end=${today}")
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          echo "GDELT Cloud summary HTTP code: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "WARN: GDELT Cloud summary endpoint returned $http_code (informational)"
            echo "$body" | cut -c1-300
          else
            bucket_count=$(node -e "
              try {
                const r = JSON.parse(process.argv[1]);
                const data = Array.isArray(r.data) ? r.data.length : 0;
                console.log(data);
              } catch (e) {
                console.error('Parse error');
                process.exit(1);
              }
            " "$body")
            echo "PASS: GDELT Cloud summary returned $bucket_count country buckets"
            echo "Top 5 country buckets (by event_count):"
            node -e "
              const r = JSON.parse(process.argv[1]);
              if (Array.isArray(r.data)) {
                r.data.slice(0, 5).forEach(b => {
                  console.log('  -', b.key || '(no key)', ':', b.event_count || 0, 'events');
                });
              }
            " "$body"
          fi
        env:
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}

      - name: Diagnostic Summary
        if: always()
        run: |
          set +x
          echo "=================================="
          echo "Diagnostic Workflow Summary"
          echo "=================================="
          echo ""
          echo "Step results:"
          echo "  1. Secrets configured:    ${{ steps.verify_secrets.outcome }}"
          echo "  2. ACLED OAuth:           ${{ steps.acled_oauth.outcome }}"
          echo "  3. ACLED API call:        ${{ steps.acled_api.outcome }}"
          echo "  4. GDELT Cloud events:    ${{ steps.gdelt_events.outcome }}"
          echo "  5. GDELT Cloud summary:   ${{ steps.gdelt_summary.outcome }}"
          echo ""
          echo "Expected outcomes (current ACLED situation):"
          echo "  - ACLED OAuth should PASS (account login works)"
          echo "  - ACLED API may FAIL with 403 if account tier is Open (no API access)"
          echo "  - GDELT Cloud should PASS if API key is valid"
          echo ""
          echo "If GDELT Cloud tests PASS, M-59 GDELT Cloud integration can proceed."
          echo "If ACLED is FAIL: user needs Research/Partner tier (separate email request)."
