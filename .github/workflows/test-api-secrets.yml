name: Test API Secrets (Diagnostic)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

concurrency:
  group: gfrr-test-api-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Verify secrets are configured (not exposed)
        id: verify_secrets
        run: |
          set +x  # never trace
          if [ -z "$GDELT_CLOUD_API_KEY" ]; then echo "FAIL: GDELT_CLOUD_API_KEY not configured"; exit 1; fi
          echo "PASS: GDELT_CLOUD_API_KEY is configured (value redacted)"
        env:
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}

      - name: Test GDELT Cloud v2 API
        id: gdelt_events
        continue-on-error: true
        run: |
          set +x
          # Use a 7-day window ending today for recent events
          today=$(date -u +%Y-%m-%d)
          week_ago=$(date -u -d "7 days ago" +%Y-%m-%d)
          echo "Date window: $week_ago to $today"
          response=$(curl -sS --connect-timeout 5 --max-time 20 --max-filesize 1048576 -w "\n%{http_code}" \
            -H "Authorization: Bearer ${GDELT_CLOUD_API_KEY}" \
            -H "Accept: application/json" \
            "https://gdeltcloud.com/api/v2/events?date_start=${week_ago}&date_end=${today}&sort=recent&limit=5")
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          printf '%s' "$body" | node scripts/diagnostics/gdelt-response-summary.mjs --http-status "$http_code" --kind events
        env:
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}

      - name: Test GDELT Cloud events summary
        id: gdelt_summary
        continue-on-error: true
        run: |
          set +x
          today=$(date -u +%Y-%m-%d)
          week_ago=$(date -u -d "7 days ago" +%Y-%m-%d)
          response=$(curl -sS --connect-timeout 5 --max-time 20 --max-filesize 1048576 -w "\n%{http_code}" \
            -H "Authorization: Bearer ${GDELT_CLOUD_API_KEY}" \
            "https://gdeltcloud.com/api/v2/events/summary?group_by=country&event_family=conflict&date_start=${week_ago}&date_end=${today}")
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          printf '%s' "$body" | node scripts/diagnostics/gdelt-response-summary.mjs --http-status "$http_code" --kind summary
        env:
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}

      - name: Diagnostic Summary
        if: always()
        run: |
          set +x
          echo "=================================="
          echo "Diagnostic Workflow Summary"
          echo "=================================="
          echo ""
          echo "Step results:"
          echo "  1. Secrets configured:    ${{ steps.verify_secrets.outcome }}"
          echo "  2. GDELT Cloud events:    ${{ steps.gdelt_events.outcome }}"
          echo "  3. GDELT Cloud summary:   ${{ steps.gdelt_summary.outcome }}"
          echo ""
          echo "Expected outcomes:"
          echo "  - GDELT Cloud should PASS if API key is valid"
          echo ""
          echo "If GDELT Cloud tests PASS, M-59 GDELT Cloud integration can proceed."
          echo "ACLED removed 2026-06-02: manual xlsx only per DATA_SOURCES.md; no automated ACLED access from CI."
