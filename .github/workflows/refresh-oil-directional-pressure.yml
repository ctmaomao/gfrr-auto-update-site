name: Refresh Oil Directional Pressure

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # Daily 23:45 UTC — after Build Daily Radar Data (22:30) so ODP reuses
    # fresh radar market proxies while EIA WPSR remains the weekly physical anchor.
    - cron: '45 23 * * *'

concurrency:
  group: gfrr-main-writer-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main before refresh
        run: git pull --ff-only origin main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Refresh oil directional pressure
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: npm run build:oil-directional

      - run: npm run check:oil-directional

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oil-directional-pressure.json
          if ! git diff --cached --quiet; then
            npm run check:all
            git commit -m "chore: refresh oil directional pressure"
            git push
          fi
