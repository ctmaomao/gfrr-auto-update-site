name: Refresh Oil Directional Pressure

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # Thursday 23:30 UTC — after the weekly EIA WPSR release (Wed) and after that
    # day's Build Daily Radar Data (22:30) so radar-data reuse fields are fresh.
    - cron: '30 23 * * 4'

concurrency:
  group: gfrr-oil-directional-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Refresh oil directional pressure
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: npm run build:oil-directional
        continue-on-error: true

      - run: npm run check:oil-directional

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oil-directional-pressure.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh oil directional pressure"
            git push
          fi
