name: ACLED Authenticated Detail Discovery
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      execute_once:
        description: 'One approved login, twelve fixed detail pages, logout; no XLSX or publication'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: acled-authenticated-detail-discovery
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Offline plan
        if: ${{ !inputs.execute_once }}
        run: node scripts/discover-acled-details.mjs --dry-run
      - name: One bounded detail discovery
        if: ${{ inputs.execute_once }}
        env:
          ACLED_DOWNLOAD_USERNAME: ${{ secrets.ACLED_DOWNLOAD_USERNAME }}
          ACLED_DOWNLOAD_PASSWORD: ${{ secrets.ACLED_DOWNLOAD_PASSWORD }}
        run: node scripts/discover-acled-details.mjs --live
