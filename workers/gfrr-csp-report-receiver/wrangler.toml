# CSP report receiver — isolated B-stage resource.
#
# An isolated B-stage Worker already exists. Deployment evidence and the distinction between the
# validated health behavior and the undeployed CORS changes are recorded in docs/PROJECT_BACKLOG.md.
# Creating or updating platform resources needs separate authorization: it consumes account quota
# shared with other workers and can incur charges. Do not run `wrangler deploy` without authorization.
#
# Deliberately absent: any `routes` entry (no production hostname is attached) and any cron trigger
# (cleanup runs from the Durable Object alarm, not from a Worker schedule).

name = "gfrr-csp-report-receiver"
# The entry module is the only one that imports `cloudflare:workers`; it exports both the fetch
# handler and the Durable Object class (which must extend the runtime's `DurableObject` for RPC).
main = "src/worker-entry.js"
compatibility_date = "2026-04-28"

# A deployment of this candidate closes public ingestion by default. Opening a <=30-minute
# window needs a separate bounded platform-test approval and exact UTC timestamps with .sssZ.
# Keep the existing loopback-only CORS variable; do not grant production origins implicitly.
[vars]
CSP_TRIAL_ENABLED = "false"
CSP_TRIAL_START_AT = ""
CSP_TRIAL_END_AT = ""

# Worker logs are opt-in; enabling them is a privacy decision of its own.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "CSP_RECEIVER"
class_name = "CspReceiverObject"

# Declares the Durable Object lifecycle. wrangler treats `exports` and `migrations` as mutually
# exclusive, so this file uses `exports` only: it registers the class that this Worker exports AND
# binds, with the SQLite storage backend (the only one available on the Free plan).
#
# `wrangler deploy --dry-run` is the check that keeps this honest — the same file without the entry
# resolves the binding but warns that the class is never registered.
[exports.CspReceiverObject]
type = "durable-object"
storage = "sqlite"
