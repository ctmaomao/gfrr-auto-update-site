<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI 泡沫监测：多维领先指标体系，两轴判读泡沫成熟度与破裂临近度，每周一更新。">
<title>AI 泡沫监测 · The Bubble Watch</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Serif+SC:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #FBF7F0;
    --ink: #1A1815;
    --red: #7C1D1D;
    --yellow: #A8761A;
    --orange: #C25E2A;
    --green: #1F4D2C;
    --muted: #666;
    --warm: #3A3530;
    --canvas: #E8E0D0;
    --soft-line: #999;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
    min-height: 100vh;
  }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .display { font-family: "Playfair Display", "Noto Serif SC", serif; }
  .container { max-width: 1280px; margin: 0 auto; padding: clamp(20px, 4vw, 48px); }

  /* Masthead */
  header.masthead { border-bottom: 3px double var(--ink); padding-bottom: 20px; margin-bottom: 32px; }
  .masthead-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.3em; color: var(--red); margin-bottom: 8px; }
  h1.title { font-family: "Playfair Display", "Noto Serif SC", serif; font-size: clamp(36px, 6vw, 64px); font-weight: 900; line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
  h1.title em { font-style: italic; font-weight: 400; }
  .issue-meta { text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.8; }
  .issue-meta .small { margin-top: 8px; color: var(--muted); }

  /* Headline */
  .headline { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 32px; align-items: stretch; margin-bottom: 48px; }
  @media (max-width: 720px) { .headline { grid-template-columns: 1fr; } }
  .big-number {
    background: var(--ink); color: var(--bg); padding: 32px;
    display: flex; flex-direction: column; justify-content: space-between; min-height: 320px;
  }
  .big-number .label { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.2em; opacity: 0.6; }
  .big-number .value {
    font-family: "Playfair Display", serif; font-size: clamp(80px, 14vw, 144px);
    font-weight: 900; line-height: 0.9; letter-spacing: -0.04em;
  }
  .big-number .value sup { font-size: 0.4em; vertical-align: super; }
  .big-number .breakdown { font-family: "IBM Plex Mono", monospace; font-size: 12px; margin-top: 12px; opacity: 0.7; line-height: 1.6; }
  .big-number .footer { border-top: 1px solid rgba(251,247,240,0.2); padding-top: 12px; font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.15em; opacity: 0.5; }

  .verdict { display: flex; flex-direction: column; justify-content: space-between; }
  .verdict .label { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--red); margin-bottom: 12px; }
  .verdict h2 { font-family: "Playfair Display", "Noto Serif SC", serif; font-size: clamp(28px, 4vw, 42px); font-weight: 700; line-height: 1.15; margin: 0 0 16px 0; letter-spacing: -0.01em; }
  .verdict p { font-size: 17px; line-height: 1.7; margin: 0; color: var(--warm); }
  .verdict p em { font-style: italic; }
  .verdict .footnote { margin-top: 24px; border-top: 1px solid var(--ink); padding-top: 16px; font-family: "IBM Plex Mono", monospace; font-size: 11px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  /* DeepSeek weekly editorial — read-only, evidence-linked long-form layer */
  section.weekly-editorial { margin-bottom: 48px; border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); padding: 30px 0 34px; }
  .weekly-editorial-header { display: grid; grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr); gap: 28px; align-items: end; margin-bottom: 28px; }
  .weekly-editorial-kicker { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--red); margin-bottom: 8px; }
  .weekly-editorial-header h3 { font-family: "Playfair Display", "Noto Serif SC", serif; font-size: clamp(27px, 4vw, 40px); line-height: 1.15; margin: 0; }
  .weekly-editorial-meta { border-left: 1px solid var(--ink); padding-left: 18px; font-family: "IBM Plex Mono", monospace; font-size: 10px; line-height: 1.8; color: var(--muted); overflow-wrap: anywhere; }
  .weekly-editorial-scorecard { margin: 0 0 30px; padding: 18px 0 18px 22px; border-left: 4px solid var(--red); font-size: 17px; line-height: 1.75; color: var(--warm); }
  .weekly-editorial h4 { font-family: "Playfair Display", "Noto Serif SC", serif; font-size: 22px; margin: 28px 0 14px; border-bottom: 1px solid var(--ink); padding-bottom: 7px; }
  .weekly-editorial h4 em { font-size: 0.6em; font-weight: 400; color: var(--muted); }
  .editorial-timeline { display: grid; gap: 0; }
  .editorial-timeline-item { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 18px; padding: 16px 0; border-bottom: 1px dashed var(--soft-line); }
  .editorial-timeline-date { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--red); }
  .editorial-item-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .editorial-item-detail { font-size: 14px; color: var(--warm); line-height: 1.7; overflow-wrap: anywhere; }
  .editorial-two-column, .editorial-category-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 30px; }
  .editorial-plain-item { padding-top: 12px; border-top: 2px solid var(--ink); min-width: 0; }
  .editorial-plain-item .category-name { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.15em; margin-bottom: 7px; }
  .editorial-history { font-size: 15px; line-height: 1.75; color: var(--warm); padding: 16px 0; }
  .editorial-watch-list { margin: 0; padding: 0; list-style: none; counter-reset: editorial-watch; }
  .editorial-watch-list li { counter-increment: editorial-watch; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-bottom: 1px dashed var(--soft-line); }
  .editorial-watch-list li::before { content: counter(editorial-watch, decimal-leading-zero); font-family: "Playfair Display", serif; font-weight: 700; color: var(--red); }
  .editorial-invalidation { display: block; margin-top: 4px; color: var(--muted); font-style: italic; }
  .editorial-gaps { padding-left: 1.25em; margin: 0; color: var(--warm); font-size: 13px; line-height: 1.75; }
  .editorial-sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; font-family: "IBM Plex Mono", monospace; font-size: 10px; line-height: 1.55; }
  .editorial-source { min-width: 0; overflow-wrap: anywhere; }
  .editorial-source a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); }
  .editorial-source .source-class { color: var(--muted); }
  .editorial-review-warning { margin-top: 22px; padding: 10px 14px; border: 1px solid var(--yellow); color: var(--warm); font-size: 12px; line-height: 1.6; }
  @media (max-width: 720px) {
    .weekly-editorial-header, .editorial-two-column, .editorial-category-grid, .editorial-sources { grid-template-columns: 1fr; }
    .weekly-editorial-meta { border-left: 0; border-top: 1px solid var(--ink); padding: 12px 0 0; }
    .editorial-timeline-item { grid-template-columns: 1fr; gap: 5px; }
  }

  /* Two-axis read (stage x trigger) */
  section.axes { margin-bottom: 48px; border: 1px solid var(--ink); padding: 20px; }
  .axes-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .axes-header h3 { font-family: "Playfair Display", "Noto Serif SC", serif; font-size: 22px; font-weight: 700; margin: 0; }
  .axes-header h3 em { font-style: italic; font-weight: 400; font-size: 0.7em; }
  .axes-header .now { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
  .axes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 720px) { .axes-grid { grid-template-columns: 1fr; } }
  .axis-label { display: flex; justify-content: space-between; align-items: baseline; font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
  .axis-label .axis-score { font-weight: 600; color: var(--ink); letter-spacing: 0.05em; }
  .axis-bar { position: relative; height: 40px; border: 1px solid var(--ink); display: flex; }
  .axis-bar .zone { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; color: var(--bg); min-width: 0; padding: 2px; text-align: center; }
  .axis-bar .zone.t-green { background: var(--green); }
  .axis-bar .zone.t-yellow { background: var(--yellow); }
  .axis-bar .zone.t-orange { background: var(--orange); }
  .axis-bar .zone.t-red { background: var(--red); }
  .axis-bar .zone-label { font-size: 11px; font-weight: 700; line-height: 1.1; font-family: "Noto Serif SC", serif; }
  .axis-bar .zone-pct { font-family: "IBM Plex Mono", monospace; font-size: 9px; opacity: 0.85; }
  .axis-bar .marker { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); transform: translateX(-50%); }
  .axis-bar .marker::after { content: ""; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--ink); }
  .axis-desc { margin-top: 8px; font-family: "Noto Serif SC", serif; font-size: 12px; color: var(--warm); font-style: italic; line-height: 1.5; }
  .similarity-row { margin-top: 18px; border-top: 1px dashed var(--soft-line); padding-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  .similarity-row .sim-label { letter-spacing: 0.15em; color: var(--muted); margin-right: 4px; }
  .sim-chip { border: 1px solid var(--ink); padding: 3px 8px; }
  .sim-chip b { font-weight: 700; }
  .sim-chip.top { background: var(--ink); color: var(--bg); }
  .momentum-row { margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--warm); }
  .momentum-row .worse { color: var(--red); }
  .momentum-row .better { color: var(--green); }

  /* Trend */
  section.trend { margin-bottom: 48px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 24px 0; }
  .trend-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .trend-header h3 { font-family: "Playfair Display", serif; font-size: 22px; font-weight: 700; margin: 0; }
  .trend-header h3 em { font-style: italic; font-weight: 400; font-size: 0.7em; }
  .trend-legend { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  #trend-chart-wrap { position: relative; height: 220px; }
  #trend-chart-wrap svg { display: block; }
  #trend-tooltip { position: absolute; display: none; background: #1A1815; color: #FBF7F0; font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 6px 9px; pointer-events: none; white-space: nowrap; z-index: 5; line-height: 1.6; }

  /* Categories */
  section.category { margin-bottom: 40px; }
  .category-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .category-header .titles { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .category-header h3 { font-family: "Playfair Display", "Noto Serif SC", serif; font-size: 28px; font-weight: 900; margin: 0; letter-spacing: -0.01em; }
  .category-header .en { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }
  .category-header .counts { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  .counts .red { color: var(--red); }
  .counts .yellow { color: var(--yellow); }

  .indicator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
  article.indicator { border: 1px solid var(--ink); background: var(--bg); padding: 18px; position: relative; display: flex; flex-direction: column; gap: 10px; }
  article.indicator .status-bar { position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
  .status-bar.red { background: var(--red); }
  .status-bar.yellow { background: var(--yellow); }
  .status-bar.green { background: var(--green); }
  article.indicator .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 4px; }
  article.indicator .name-en { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.15em; color: var(--muted); }
  article.indicator .name-zh { font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 600; margin-top: 2px; }
  .score-role { display: inline-block; margin-top: 7px; padding: 2px 6px; border: 1px solid var(--ink); font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: 0.12em; color: var(--ink); }
  .score-role.shadow { border-style: dashed; color: var(--muted); border-color: var(--soft-line); }
  .badge { font-family: "IBM Plex Mono", monospace; font-size: 10px; padding: 4px 8px; letter-spacing: 0.1em; font-weight: 600; white-space: nowrap; color: var(--bg); }
  .badge.red { background: var(--red); }
  .badge.yellow { background: var(--yellow); }
  .badge.green { background: var(--green); }
  article.indicator .number { font-family: "Playfair Display", serif; font-size: 38px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  article.indicator .number .unit { font-size: 0.5em; font-weight: 400; margin-left: 2px; }
  article.indicator .note { font-family: "Noto Serif SC", serif; font-size: 13px; color: var(--warm); line-height: 1.55; font-style: italic; overflow-wrap: anywhere; }
  article.indicator .meta { border-top: 1px dashed var(--soft-line); padding-top: 8px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
  article.indicator.stale::after { content: "STALE"; position: absolute; top: 8px; right: 8px; font-family: "IBM Plex Mono", monospace; font-size: 9px; padding: 2px 5px; background: #ddd; color: #555; letter-spacing: 0.1em; }
  .carry-tag { background: var(--canvas); color: var(--yellow); padding: 1px 4px; font-weight: 600; }

  /* WoW */
  section.wow { margin-bottom: 40px; background: var(--ink); color: var(--bg); padding: 28px; }
  section.wow .label { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.2em; opacity: 0.6; margin-bottom: 16px; }
  .wow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }
  .wow-item .tag { font-family: "IBM Plex Mono", monospace; font-size: 10px; margin-bottom: 4px; }
  .wow-item .tag.up { color: var(--yellow); }
  .wow-item .tag.down { color: #7DB37C; }
  .wow-item .tag.flat { color: var(--soft-line); }
  .wow-item .text { font-family: "Noto Serif SC", serif; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }

  /* Public market technical heat audit */
  section.market-technical-heat { margin-bottom: 40px; }
  .technical-audit-summary {
    border: 1px solid var(--ink);
    border-top: 4px solid var(--yellow);
    padding: 18px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(180px, 0.6fr);
    gap: 18px;
    align-items: start;
  }
  .technical-audit-summary .label { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.18em; color: var(--muted); margin-bottom: 8px; }
  .technical-audit-summary .technical-headline { font-family: "Playfair Display", "Noto Serif SC", serif; font-size: 24px; font-weight: 900; line-height: 1.15; margin: 0 0 8px 0; }
  .technical-audit-summary .summary-text { font-family: "Noto Serif SC", serif; font-size: 13px; color: var(--warm); line-height: 1.65; }
  .technical-audit-summary .meta-lines { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); line-height: 1.8; border-left: 1px solid var(--ink); padding-left: 14px; }
  .technical-audit-summary.red { border-top-color: var(--red); }
  .technical-audit-summary.green { border-top-color: var(--green); }
  .technical-audit-summary.unavailable { border-top-color: var(--muted); }
  @media (max-width: 720px) {
    .technical-audit-summary { grid-template-columns: 1fr; }
    .technical-audit-summary .meta-lines { border-left: 0; border-top: 1px solid var(--ink); padding-left: 0; padding-top: 10px; }
  }

  /* Watch */
  section.watch { margin-bottom: 48px; }
  section.watch h3 { font-family: "Playfair Display", "Noto Serif SC", serif; font-size: 24px; font-weight: 700; margin: 0 0 16px 0; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
  section.watch h3 em { font-style: italic; font-weight: 400; }
  .watch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
  .watch-item { border-left: 3px solid var(--red); padding-left: 14px; }
  .watch-item .icon { font-family: "Playfair Display", serif; font-size: 20px; font-weight: 700; color: var(--red); margin-bottom: 4px; }
  .watch-item .title { font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .watch-item .desc { font-family: "Noto Serif SC", serif; font-size: 13px; line-height: 1.6; color: var(--warm); }

  /* Footer */
  footer.method { border-top: 3px double var(--ink); padding-top: 24px; margin-top: 48px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); line-height: 1.7; }
  .method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 24px; }
  .method-grid h4 { color: var(--ink); font-weight: 600; margin: 0 0 6px 0; font-family: inherit; font-size: 11px; }

  /* Loading state */
  .loading { padding: 80px 0; text-align: center; font-family: "IBM Plex Mono", monospace; color: var(--muted); }
  .error { padding: 40px; background: #fee; border-left: 4px solid var(--red); margin: 32px 0; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--red); }

  /* ── 页面切换书签(与 index.html 共用同一组件契约;统一固定右上角,避免遮挡手机端刊头标题)── */
  .page-bookmarks { position: fixed; top: 0; right: clamp(10px, 2.5vw, 30px); display: flex; gap: 10px; z-index: 1000; }
  .page-bookmarks .pbm {
    display: block; width: 34px; height: 128px; position: relative;
    text-decoration: none; color: #FBF7F0;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), 50% 100%, 0 calc(100% - 10px));
    transform: translateY(calc(-100% + 24px));
    transition: transform .38s cubic-bezier(.34, 1.45, .64, 1), filter .2s ease;
    box-shadow: 0 2px 6px rgba(26, 24, 21, .35);
    filter: saturate(.82);
  }
  .page-bookmarks .pbm:nth-child(2) { transition-delay: .04s; }
  .page-bookmarks .pbm-radar { background: linear-gradient(180deg, #5d1515 0%, #7C1D1D 100%); }
  .page-bookmarks .pbm-bubble { background: linear-gradient(180deg, #7d5813 0%, #A8761A 100%); }
  .page-bookmarks .pbm-label {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    writing-mode: vertical-rl; font-family: "Noto Serif SC", serif;
    font-size: 13px; font-weight: 600; letter-spacing: .3em; white-space: nowrap;
  }
  .page-bookmarks .pbm-dot {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(251, 247, 240, .85);
  }
  .page-bookmarks .pbm-active { filter: saturate(1.1); }
  .page-bookmarks .pbm-active .pbm-dot { box-shadow: 0 0 0 2.5px rgba(251, 247, 240, .3); }
  .page-bookmarks:hover .pbm, .page-bookmarks:focus-within .pbm { transform: translateY(0); filter: saturate(1.1); }
  .page-bookmarks .pbm:hover { filter: saturate(1.25) brightness(1.06); }
  .page-bookmarks .pbm:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* 触屏带尾 36px:与 index.html 同步,止于手机端刊头标题之上,避免角部遮字 */
  @media (hover: none) { .page-bookmarks .pbm { transform: translateY(calc(-100% + 36px)); } }
  @media (prefers-reduced-motion: reduce) { .page-bookmarks .pbm { transition: none; } }
  @media print { .page-bookmarks { display: none; } }
</style>
</head>
<body>
<nav class="page-bookmarks" aria-label="站内页面切换">
  <a class="pbm pbm-radar" href="index.html" title="切换到 全球金融风险雷达">
    <span class="pbm-label">风险雷达</span>
    <span class="pbm-dot" aria-hidden="true"></span>
  </a>
  <a class="pbm pbm-bubble pbm-active" href="bubble-watch.html" aria-current="page" title="AI泡沫(当前页)">
    <span class="pbm-label">AI泡沫</span>
    <span class="pbm-dot" aria-hidden="true"></span>
  </a>
</nav>

<div class="container" id="root">
  <div class="loading">LOADING THE BUBBLE WATCH …</div>
</div>

<script>
// Editorial layout follows The Bubble Watch;data comes from this repo's weekly pipeline.
// Bubble Watch v2 renders 27 cards while scoring only the frozen Core-23;trend uses comparable Core-23 replays.
const CATEGORY_ORDER = [
  { key: 'valuation',        zh: '估值',     en: 'VALUATION' },
  { key: 'capital',          zh: '资金面',    en: 'CAPITAL' },
  { key: 'market_structure', zh: '市场结构',  en: 'MARKET STRUCTURE' },
  { key: 'credit',           zh: '信用',     en: 'CREDIT' },
  { key: 'fundamentals',     zh: '基本面',    en: 'FUNDAMENTALS' },
  { key: 'macro',            zh: '宏观',     en: 'MACRO' }
];

const WATCH_LIST = [
  { icon: '①', title: 'Hyperscaler Capex 指引', desc: '任何一家 Mag7 在下次季报下调当年 capex 即转 RED——结构性顶部信号' },
  { icon: '②', title: 'Fed 政策路径', desc: '油价/CPI 若迫使 Fed 重启加息,与 1999-2000、1845 铁路狂热顶部完全同构' },
  { icon: '③', title: 'CoreWeave / Nebius 信用', desc: '数据中心 ABS 利差走阔 50bps+ 是 vendor financing 链条松动的最早信号' },
  { icon: '④', title: 'OpenAI 审计师披露', desc: 'Burry 提出但未确认。任何 round-tripping 调查都是即时 RED' },
  { icon: '⑤', title: 'Anthropic IPO 时点', desc: '若按计划推进,「AI 公司 IPO 洪流」指标可能转 RED' },
  { icon: '⑥', title: 'Mag7 内部人减持', desc: '当前类 Thiel 案例零星出现,需观察是否扩散至 Mag7 高管' }
];

function escapeHtml(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function safeHttpsUrl(value) {
  try {
    const url = new URL(String(value || ''));
    return url.protocol === 'https:' ? url.toString() : null;
  } catch {
    return null;
  }
}

function eligibleWeeklyEditorial(data, nowMs = Date.now()) {
  const layer = data?.summary?.weekly_editorial;
  if (!layer || layer.schemaVersion !== 'bubble-watch-weekly-editorial-production-v1') return null;
  if (layer.status !== 'valid' || layer.displayEnabled !== true) return null;
  if (layer.asOfDate !== data.as_of_date || layer.output?.asOfDate !== data.as_of_date) return null;
  if (layer.provider !== 'deepseek' || layer.mode !== 'external_ai_weekly_editorial') return null;
  if (layer.validation?.status !== 'pass' || !['pass', 'warn'].includes(layer.qualityReview?.status)) return null;
  if (layer.qualityReview?.promotionEligible !== false || layer.provenance?.humanApproved !== false) return null;
  if (layer.boundaries?.frontendDisplayApproved !== true || layer.boundaries?.displayOnly !== true) return null;
  for (const key of ['affectsBubbleWatchScoring', 'affectsCore23', 'affectsShadow4', 'affectsStageTrigger', 'affectsGfrrScoring', 'affectsDecisionModel', 'affectsExecutionLock', 'affectsPositionGuidance']) {
    if (layer.boundaries?.[key] !== false) return null;
  }
  if (layer.freshness?.isStale !== false) return null;
  const generatedAtMs = Date.parse(layer.freshness?.artifactGeneratedAt || layer.generatedAt || '');
  const maxAgeHours = Math.min(Number(layer.freshness?.maxAgeHours) || 0, 240);
  if (!Number.isFinite(generatedAtMs) || maxAgeHours <= 0) return null;
  const ageHours = (nowMs - generatedAtMs) / 3_600_000;
  if (ageHours < -1 || ageHours > maxAgeHours) return null;
  if (!layer.output?.headlineZh || !layer.output?.leadZh) return null;
  return layer;
}

function renderWeeklyEditorial(layer) {
  if (!layer) return '';
  const output = layer.output || {};
  const categoryNames = Object.fromEntries(CATEGORY_ORDER.map(item => [item.key, `${item.zh} · ${item.en}`]));
  const attributionById = new Map((output.sourceAttribution || []).map(item => [item.sourceRefId, item]));
  const generatedLabel = String(layer.generatedAt || '').replace('T', ' ').replace(/\.\d{3}Z$/u, ' UTC');
  const confidence = output.confidence || {};
  const confidenceLabels = { low: '低', medium: '中等', high: '高' };
  const qualityLabels = { pass: '通过', warn: '有提示' };
  const reviewWarningLabels = {
    'only one official/cross_checked news reference was used; remaining factual claims require site-indicator corroboration': '本周期仅使用 1 条官方或交叉确认新闻；其余事实性判断均需站内指标共同支撑',
    'news discovery was partial; visible data gaps must retain this limitation': '本周期新闻发现覆盖有限；页面数据限制必须保留这一说明'
  };
  const sourceClassLabels = {
    site_structured: '站内结构化',
    site_structured_proxy: '站内结构化代理',
    official: '官方来源',
    cross_checked: '交叉确认',
    discovery_only: '仅新闻发现'
  };
  const confidenceScore = Number.isFinite(confidence.score)
    ? (confidence.score > 0 && confidence.score <= 1 ? Math.round(confidence.score * 100) : confidence.score)
    : '—';
  const warnings = Array.isArray(layer.qualityReview?.warnings) ? layer.qualityReview.warnings : [];
  return `
    <section class="weekly-editorial" id="weekly-editorial" data-editorial-status="${escapeHtml(layer.qualityReview.status)}">
      <div class="weekly-editorial-header">
        <div>
          <div class="weekly-editorial-kicker">DEEPSEEK WEEKLY EDITORIAL · 只读解释层</div>
          <h3>证据如何拼成这一周</h3>
        </div>
        <div class="weekly-editorial-meta">
          <div>PROVIDER ${escapeHtml(layer.provider)} · ${escapeHtml(layer.model)}</div>
          <div>GENERATED ${escapeHtml(generatedLabel)}</div>
          <div>置信度 ${escapeHtml(confidenceLabels[confidence.level] || confidence.level || '—')} · ${confidenceScore}/100</div>
          <div>质量 ${escapeHtml(qualityLabels[layer.qualityReview.status] || layer.qualityReview.status)} · 不进入 Core-23 / Stage / Trigger</div>
        </div>
      </div>

      <div class="weekly-editorial-scorecard">${escapeHtml(output.scorecardSynthesisZh)}</div>

      <h4>周内时间线 <em>· WEEKLY TIMELINE</em></h4>
      <div class="editorial-timeline">
        ${(output.weeklyTimeline || []).map(item => `
          <div class="editorial-timeline-item">
            <div class="editorial-timeline-date">${escapeHtml(item.date)}</div>
            <div><div class="editorial-item-title">${escapeHtml(item.titleZh)}</div><div class="editorial-item-detail">${escapeHtml(item.detailZh)}</div></div>
          </div>
        `).join('')}
      </div>

      <h4>关键矛盾 <em>· KEY TENSIONS</em></h4>
      <div class="editorial-two-column">
        ${(output.keyTensions || []).map(item => `<div class="editorial-plain-item"><div class="editorial-item-title">${escapeHtml(item.titleZh)}</div><div class="editorial-item-detail">${escapeHtml(item.detailZh)}</div></div>`).join('')}
      </div>

      <h4>六类证据 <em>· CATEGORY READ</em></h4>
      <div class="editorial-category-grid">
        ${(output.categoryAnalysis || []).map(item => `<div class="editorial-plain-item"><div class="category-name">${escapeHtml(categoryNames[item.category] || item.category)}</div><div class="editorial-item-detail">${escapeHtml(item.detailZh)}</div></div>`).join('')}
      </div>

      <h4>历史差异 <em>· HISTORICAL DIFFERENCE</em></h4>
      <div class="editorial-history"><b>${escapeHtml(output.historicalComparison?.period || '历史对照')}</b> · ${escapeHtml(output.historicalComparison?.detailZh)}</div>

      <h4>下周观察与反证 <em>· WATCH & INVALIDATION</em></h4>
      <ol class="editorial-watch-list">
        ${(output.watchNextWeek || []).map(item => `<li><div><span>${escapeHtml(item.conditionZh)}</span><span class="editorial-invalidation">反证: ${escapeHtml(item.invalidationZh)}</span></div></li>`).join('')}
      </ol>

      <h4>数据限制 <em>· DATA GAPS</em></h4>
      <ul class="editorial-gaps">${(output.dataGaps || []).map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>

      <h4>来源 <em>· SOURCE LEDGER</em></h4>
      <div class="editorial-sources">
        ${(layer.sourceLedger || []).map(source => {
          const url = safeHttpsUrl(source.url);
          const label = source.title || source.sourceName || source.id;
          const attribution = attributionById.get(source.id);
          return `<div class="editorial-source">${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>` : `<span>${escapeHtml(label)}</span>`}<br/><span class="source-class">${escapeHtml(sourceClassLabels[source.sourceClass] || source.sourceClass)}${attribution?.noteZh ? ` · ${escapeHtml(attribution.noteZh)}` : ''}</span></div>`;
        }).join('')}
      </div>
      ${warnings.length ? `<div class="editorial-review-warning">质量提示: ${warnings.map(item => escapeHtml(reviewWarningLabels[item] || item)).join('；')}</div>` : ''}
    </section>
  `;
}

function statusBadge(status) {
  const map = { red: '● RED', yellow: '◐ YELLOW', green: '○ GREEN' };
  return `<span class="badge ${status}">${map[status] || status}</span>`;
}

function renderMarketTechnicalHeat(panel) {
  if (!panel || panel.contractVersion !== 'bubble-watch-market-technical-heat-v1') return '';
  const status = panel.status || 'unavailable';
  const counts = panel.counts || {};
  const basket = panel.basket || {};
  const labelZh = status === 'red' ? '技术过热' : status === 'yellow' ? '升温观察' : status === 'green' ? '温度可控' : '数据暂缺';
  const statusClass = ['red', 'yellow', 'green'].includes(status) ? status : 'unavailable';
  const items = Array.isArray(panel.items) ? panel.items : [];
  return `
    <section class="market-technical-heat" id="market-technical-heat">
      <div class="category-header">
        <div class="titles">
          <h3>公开市场技术热度</h3>
          <span class="en">PUBLIC MARKET TECHNICAL HEAT</span>
        </div>
        <div class="counts">
          辅助观察 · ${(counts.total ?? items.length) || 0} 个市场温度项 · <span class="red">${counts.red ?? 0} 红</span> · <span class="yellow">${counts.yellow ?? 0} 黄</span>
        </div>
      </div>
      <div class="technical-audit-summary ${statusClass}">
        <div>
          <div class="label">MARKET TEMPERATURE · 独立观察</div>
          <div class="technical-headline">${escapeHtml(labelZh)}${Number.isFinite(panel.heat_score) ? ` · ${panel.heat_score.toFixed(1)}/100` : ''}</div>
          <div class="summary-text">${escapeHtml(panel.summary || '公开市场技术热度暂缺;仅作市场温度观察。')}</div>
        </div>
        <div class="meta-lines">
          <div>篮子: ${escapeHtml((basket.symbols || basket.requestedSymbols || []).join('/') || '—')}</div>
          <div>数据口径: ${escapeHtml('公开日线价格')}</div>
          <div>备用口径: ${escapeHtml('其它公开价格源')}</div>
          <div>解释边界: 反映市场温度,不替代估值/基本面判断</div>
        </div>
      </div>
      ${items.length ? `
        <div class="indicator-grid">
          ${items.map(item => `
            <article class="indicator">
              <div class="status-bar ${item.status}"></div>
              <div class="head">
                <div>
                  <div class="name-en">${escapeHtml(item.name_en)}</div>
                  <div class="name-zh">${escapeHtml(item.name_zh)}</div>
                </div>
                ${statusBadge(item.status)}
              </div>
              <div class="number">${escapeHtml(item.value_display)}</div>
              <div class="note">${escapeHtml(item.note)}</div>
              <div class="meta">
                <span>${escapeHtml(item.threshold_text)}</span>
                <span>${escapeHtml(item.source_name)}</span>
              </div>
            </article>
          `).join('')}
        </div>
      ` : ''}
    </section>
  `;
}

const TIER_FROM_LABEL_ZH = { '系统性顶部信号': 'top', '系统性顶部': 'top', '高风险预警': 'alert', '中度警戒': 'caution', '观察期': 'observation' };
const TIER_LABEL_ZH = { observation: '观察期', caution: '中度警戒', alert: '高风险预警', top: '系统性顶部' };

function tierFromPct(p) {
  if (p >= 60) return 'top';
  if (p >= 40) return 'alert';
  if (p >= 25) return 'caution';
  return 'observation';
}

let lastData = null;

function render(data) {
  lastData = data;
  const s = data.summary;
  const indicators = data.indicators;
  const coreCount = s.scoring_total_indicators ?? indicators.filter(item => item.score_role === 'core').length;
  const shadowCount = indicators.filter(item => item.score_role === 'shadow').length;
  const issueNo = String(data.issue_number).padStart(3, '0');
  const headlineColor = s.red_pct >= 60 ? '#E63946' : s.red_pct >= 40 ? '#E89B3C' : s.red_pct >= 25 ? '#F1C232' : 'var(--bg)';

  // override 检测:原始档位(red_pct)vs 生效档位(verdict_label)
  const baseTier = tierFromPct(s.red_pct);
  const effTier = TIER_FROM_LABEL_ZH[s.verdict_label] || baseTier;
  const overrideActive = effTier !== baseTier;

  const meta = data.meta || {};
  const pipelineLine = `数据覆盖:${meta.auto_count ?? '—'} 项公开数据口径 / ${(meta.curated_count ?? 0) + (meta.fallback_count ?? 0)} 项研究口径`;
  const weeklyEditorial = eligibleWeeklyEditorial(data);
  const heroHeadline = weeklyEditorial?.output?.headlineZh || s.verdict_label;
  const heroLead = weeklyEditorial?.output?.leadZh || s.verdict_desc;

  const root = document.getElementById('root');
  root.innerHTML = `
    <header class="masthead">
      <div class="masthead-row">
        <div>
          <div class="kicker">${s.total_indicators} 张证据卡 · ${coreCount} 项固定核心 · 每周一更新</div>
          <h1 class="title">AI 泡沫监测<br/><em>The Bubble Watch</em></h1>
        </div>
        <div class="issue-meta">
          <div>ISSUE NO. ${issueNo}</div>
          <div>${escapeHtml(data.as_of_date)}</div>
          <div class="small">CORE-${coreCount} · SHADOW-${shadowCount} · 6 CATEGORIES</div>
        </div>
      </div>
    </header>

    <section class="headline">
      <div class="big-number">
        <div class="label">风险温度 · CORE RED LIGHT RATIO</div>
        <div>
          <div class="value" style="color:${headlineColor}">${s.red_pct.toFixed(1)}<sup>%</sup></div>
          <div class="breakdown">
            固定核心: ${s.scoring_red_count} 红 / ${s.scoring_yellow_count} 黄 / ${s.scoring_green_count} 绿<br/>
            全部展示: ${s.red_count} 红 / ${s.yellow_count} 黄 / ${s.green_count} 绿 · ${shadowCount} 项影子观察<br/>
            阈值: 25% 黄 / 40% 橙 / 60% 红${overrideActive ? `<br/>原始档位 ${TIER_LABEL_ZH[baseTier]} · 综合判读 ${escapeHtml(s.verdict_label)}` : ''}
          </div>
        </div>
        <div class="footer">PRIMARY SCORE: ${s.scoring_red_count} / CORE-${coreCount} RED = ${s.red_pct.toFixed(1)}%</div>
      </div>
      <div class="verdict">
        <div>
          <div class="label">本周判读 · THIS WEEK'S VERDICT</div>
          <h2>${escapeHtml(heroHeadline)}</h2>
          <p>${escapeHtml(heroLead)}</p>
        </div>
        <div class="footnote">
          <span>Issue ${issueNo} · ${escapeHtml(data.as_of_date)}${weeklyEditorial ? ` · 固定判读 ${escapeHtml(s.verdict_label)}` : ''}</span>
          <span>对照: 2000-03 (CAPE 44.19, NDX -78%)</span>
        </div>
      </div>
    </section>

    ${renderWeeklyEditorial(weeklyEditorial)}

    ${(s.stage_score != null && s.trigger_score != null) ? `
    <section class="axes">
      <div class="axes-header">
        <h3>两轴判读 <em>· Stage × Trigger</em></h3>
        <div class="now">固定核心判读 · 泡沫成熟度 ${s.stage_score.toFixed(0)} · 破裂临近度 ${s.trigger_score.toFixed(0)}</div>
      </div>
      <div class="axes-grid">
        <div class="axis-block">
          <div class="axis-label"><span>泡沫成熟度 · STAGE</span><span class="axis-score">${s.stage_score.toFixed(1)} · ${escapeHtml(s.stage_label)}</span></div>
          <div class="axis-bar">
            <div class="zone t-green" style="flex:30"><span class="zone-label">早期</span><span class="zone-pct">0–30</span></div>
            <div class="zone t-yellow" style="flex:20"><span class="zone-label">扩张</span><span class="zone-pct">30–50</span></div>
            <div class="zone t-orange" style="flex:20"><span class="zone-label">亢奋</span><span class="zone-pct">50–70</span></div>
            <div class="zone t-red" style="flex:30"><span class="zone-label">极端</span><span class="zone-pct">≥70</span></div>
            <div class="marker" style="left:${Math.min(Math.max(s.stage_score, 0.5), 99.5)}%"></div>
          </div>
          <div class="axis-desc">慢变量：估值 · 资金结构 · 发行热度 · 叙事——回答“泡沫有多大”</div>
        </div>
        <div class="axis-block">
          <div class="axis-label"><span>破裂临近度 · TRIGGER</span><span class="axis-score">${s.trigger_score.toFixed(1)} · ${escapeHtml(s.trigger_label)}</span></div>
          <div class="axis-bar">
            <div class="zone t-green" style="flex:25"><span class="zone-label">引线未燃</span><span class="zone-pct">0–25</span></div>
            <div class="zone t-yellow" style="flex:20"><span class="zone-label">零星火花</span><span class="zone-pct">25–45</span></div>
            <div class="zone t-orange" style="flex:20"><span class="zone-label">引线点燃</span><span class="zone-pct">45–65</span></div>
            <div class="zone t-red" style="flex:35"><span class="zone-label">破裂进行中</span><span class="zone-pct">≥65</span></div>
            <div class="marker" style="left:${Math.min(Math.max(s.trigger_score, 0.5), 99.5)}%"></div>
          </div>
          <div class="axis-desc">快变量：信用利差 · 市场广度 · 内部人 · 收入动量 · 宏观政策——回答“引线是否点燃”</div>
        </div>
      </div>
      ${(s.similarity && s.similarity.length) ? `
      <div class="similarity-row">
        <span class="sim-label">核心历史相似度</span>
        ${s.similarity.map((x, i) => `<span class="sim-chip${i === 0 ? ' top' : ''}">${escapeHtml(x.period)} ${escapeHtml(x.label_zh)} <b>${x.match_pct}%</b></span>`).join('')}
      </div>` : ''}
      ${s.momentum ? `<div class="momentum-row">核心本周边际：<b class="worse">${s.momentum.deteriorated} 级恶化</b> · <b class="better">${s.momentum.improved} 级好转</b>（净 ${s.momentum.net > 0 ? '+' : ''}${s.momentum.net}）</div>` : ''}
    </section>` : ''}

    <section class="trend">
      <div class="trend-header">
        <h3>核心红灯比例趋势 <em>· CORE-23 COMPARABLE</em></h3>
        <div class="trend-legend">
          <span><span style="color:var(--red)">●</span> Core Red %</span>
          <span><span style="color:var(--yellow)">●</span> Core yellow-adjusted pressure</span>
          <span style="color:var(--muted)">阈值: 25 / 40 / 60</span>
        </div>
      </div>
      <div id="trend-chart-wrap"><div id="trend-tooltip"></div></div>
    </section>

    ${CATEGORY_ORDER.map(cat => {
      const items = indicators.filter(i => i.category === cat.key);
      if (!items.length) return '';
      const r = items.filter(i => i.status === 'red').length;
      const y = items.filter(i => i.status === 'yellow').length;
      const categoryCore = items.filter(i => i.score_role === 'core').length;
      const categoryShadow = items.length - categoryCore;
      return `
        <section class="category">
          <div class="category-header">
            <div class="titles">
              <h3>${cat.zh}</h3>
              <span class="en">${cat.en}</span>
            </div>
            <div class="counts">
              ${items.length} 张 · ${categoryCore} 核心${categoryShadow ? ` + ${categoryShadow} 影子` : ''} · <span class="red">${r} 红</span> · <span class="yellow">${y} 黄</span>
            </div>
          </div>
          <div class="indicator-grid">
            ${items.map(ind => {
              const carried = !ind.stale && ind.as_of && data.as_of_date && ind.as_of < data.as_of_date;
              return `
              <article class="indicator${ind.stale ? ' stale' : ''}">
                <div class="status-bar ${ind.status}"></div>
                <div class="head">
                  <div>
                    <div class="name-en">${escapeHtml(ind.name_en)}</div>
                    <div class="name-zh">${escapeHtml(ind.name_zh)}</div>
                    <div class="score-role ${ind.score_role === 'shadow' ? 'shadow' : 'core'}">${ind.score_role === 'shadow' ? '影子观察' : '固定核心'}</div>
                  </div>
                  ${statusBadge(ind.status)}
                </div>
                <div class="number">${escapeHtml(ind.value_display || ind.value)}</div>
                <div class="note">${escapeHtml(ind.note)}</div>
                <div class="meta">
                  <span>${escapeHtml(ind.threshold_text)}</span>
                  <span>${escapeHtml(ind.source_name)}${ind.as_of ? ` · ${escapeHtml(ind.as_of)}` : ''}${carried ? ' <span class="carry-tag">沿用</span>' : ''}</span>
                </div>
              </article>
            `;}).join('')}
          </div>
        </section>
      `;
    }).join('')}

    ${(data.wow_changes && data.wow_changes.length) ? `
      <section class="wow">
        <div class="label">本周关键变化 · WEEK-OVER-WEEK CHANGES</div>
        <div class="wow-grid">
          ${data.wow_changes.map(w => {
            const tagClass = w.type === 'status_upgrade' ? 'up' : w.type === 'status_downgrade' ? 'down' : 'flat';
            const tagLabel = w.type === 'status_upgrade' ? '▲ 风险升高' : w.type === 'status_downgrade' ? '▼ 风险下降' : '━ 持平';
            return `
              <div class="wow-item">
                <div class="tag ${tagClass}">${tagLabel}</div>
                <div class="text">${escapeHtml(w.note)}</div>
              </div>
            `;
          }).join('')}
        </div>
      </section>
    ` : ''}

    ${renderMarketTechnicalHeat(data.market_technical_heat)}

    <section class="watch">
      <h3>观察清单 · <em>What to Watch</em></h3>
      <div class="watch-grid">
        ${WATCH_LIST.map(w => `
          <div class="watch-item">
            <div class="icon">${w.icon}</div>
            <div class="title">${escapeHtml(w.title)}</div>
            <div class="desc">${escapeHtml(w.desc)}</div>
          </div>
        `).join('')}
      </div>
    </section>

    <footer class="method">
      <div class="method-grid">
        <div>
          <h4>方法论</h4>
          <div>${s.total_indicators} 张证据卡全部展示,其中固定核心 ${coreCount} 项等权计分、影子观察 ${shadowCount} 项暂不入分。主分数为核心红灯比例;STAGE（泡沫成熟度）与 TRIGGER（破裂临近度）、分类共振、周度动量和历史相似度也只使用固定核心。双类红灯共振,或 stage≥60 且 trigger≥50,可升级综合判读;stage≥60 且 trigger≥65 对应系统性顶部信号。黄灯调整压力分仅用于核心可比趋势。</div>
        </div>
        <div>
          <h4>历史对照</h4>
          <div>2000 dot-com、1845 铁路狂热、1996 telecom 泡沫顶部前 6-12 个月,下列指标均闪烁: 内部人减持、capex/FCF 背离、广度恶化、循环融资、CEO 对冲表态。</div>
        </div>
        <div>
          <h4>数据新鲜度</h4>
          <div>卡片右下角显示各自数据日期;与本期日期不一致但仍在时效窗口内标“沿用”,超过 maxAgeDays 标 STALE。自动源不可用时继续沿用有日期的本地快照,不造数。</div>
        </div>
        <div>
          <h4>免责</h4>
          <div>本文为框架研究,非投资建议,仅供参考,不构成交易依据。指标阈值随研究演进调整。Issue ${issueNo} · ${escapeHtml(data.as_of_date)}. ${escapeHtml(pipelineLine)}. <a href="https://radar.gfrfinradar.uk/" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink);border-bottom:1px solid var(--ink);text-decoration:none;padding-bottom:1px;">https://radar.gfrfinradar.uk/</a></div>
        </div>
      </div>
    </footer>
  `;

  drawTrend(data);
}

// 手写 SVG 双线趋势图(替代 Chart.js:免外部依赖,视觉对齐原页)
function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function drawTrend(data) {
  const seed = data.history_seed || [];
  const wrap = document.getElementById('trend-chart-wrap');
  if (!wrap || !seed.length) return;
  const W = Math.max(320, wrap.clientWidth);
  const H = 220;
  const padL = 44, padR = 14, padT = 10, padB = 26;
  const ymax = 70;
  const x = i => padL + (seed.length === 1 ? 0 : i * (W - padL - padR) / (seed.length - 1));
  const y = v => padT + (1 - Math.min(v, ymax) / ymax) * (H - padT - padB);

  let grid = '';
  for (let v = 0; v <= ymax; v += 10) {
    grid += `<line x1="${padL}" y1="${y(v)}" x2="${W - padR}" y2="${y(v)}" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>`;
    grid += `<text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1A1815">${v}%</text>`;
  }
  // 窄屏抽稀 x 轴标签,避免周标重叠(尾点始终保留)
  const labelStep = W < 560 ? Math.ceil(seed.length / 5) : 1;
  let xlabels = '';
  seed.forEach((p, i) => {
    if (i % labelStep !== 0 && i !== seed.length - 1) return;
    xlabels += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1A1815">${escapeHtml(p.week)}</text>`;
  });

  const redPts = seed.map((p, i) => ({ x: x(i), y: y(p.red_pct) }));
  const ylwPts = seed.map((p, i) => ({ x: x(i), y: y(p.risk_score) }));
  const redDots = redPts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#7C1D1D"/>`).join('');
  const ylwDots = ylwPts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#A8761A"/>`).join('');

  const tooltip = document.getElementById('trend-tooltip');
  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Core-23 红灯比例与黄灯调整压力趋势">
      ${grid}
      <path d="${smoothPath(ylwPts)}" fill="none" stroke="#A8761A" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="${smoothPath(redPts)}" fill="none" stroke="#7C1D1D" stroke-width="2.5"/>
      ${ylwDots}${redDots}
      ${xlabels}
    </svg>
  `;
  wrap.appendChild(tooltip);

  const svg = wrap.querySelector('svg');
  svg.addEventListener('mousemove', (ev) => {
    const rect = svg.getBoundingClientRect();
    const mx = (ev.clientX - rect.left) * (W / rect.width);
    let best = 0;
    let bestDist = Infinity;
    seed.forEach((p, i) => {
      const d = Math.abs(x(i) - mx);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    const p = seed[best];
    tooltip.style.display = 'block';
    tooltip.innerHTML = `${escapeHtml(p.week)}<br>Core Red % ${p.red_pct.toFixed(1)}<br>Core Pressure ${p.risk_score.toFixed(1)}`;
    const tx = Math.min(Math.max(x(best) / W * rect.width - 40, 0), rect.width - 110);
    tooltip.style.left = `${tx}px`;
    tooltip.style.top = `${Math.max(y(Math.max(p.red_pct, p.risk_score)) / H * rect.height - 64, 0)}px`;
  });
  svg.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (lastData) drawTrend(lastData); }, 150);
});

async function load() {
  try {
    const r = await fetch(`data/bubble-watch.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    render(data);
  } catch (e) {
    document.getElementById('root').innerHTML = `
      <div class="error">数据加载失败: ${escapeHtml(e.message)}<br>检查 data/bubble-watch.json 是否存在</div>
    `;
  }
}
load();
</script>
